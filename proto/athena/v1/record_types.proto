syntax = "proto3";
package athena.v1;
option go_package = "athena-erp/gen/athena/v1;athenav1";

import "athena/v1/records.proto";

// RecordTypeService reads and saves Record Types. Saving applies the Record
// Type's table changes and activates the new revision as one journaled
// operation.
service RecordTypeService {
  rpc ListRecordTypes(ListRecordTypesRequest) returns (ListRecordTypesResponse);
  // PlanRecordTypeSave describes the table migration a save would run,
  // without changing anything.
  rpc PlanRecordTypeSave(PlanRecordTypeSaveRequest) returns (PlanRecordTypeSaveResponse);
  rpc SaveRecordType(SaveRecordTypeRequest) returns (SaveRecordTypeResponse);
  // DeleteRecordType drops the Record Type's table with its Records and
  // removes the definition. It is refused while other Record Types link to it.
  rpc DeleteRecordType(DeleteRecordTypeRequest) returns (DeleteRecordTypeResponse);
}

// EnumValue is one permanent choice of an Enum field.
message EnumValue {
  // Lowercase identifier stored in the column. Fixed once saved.
  string value = 1;
  string label = 2;
}

message RecordTypeField {
  // Lowercase snake_case column key. Fixed once saved.
  string key = 1;
  string label = 2;
  // One of Text, Long text, Email, Phone, Number, Currency, Date, Select,
  // Link, Checkbox, Money, Quantity, Enum, Image.
  string type = 3;
  bool required = 4;
  // Key of the linked Record Type, for Link fields only.
  string target_record_type_key = 5;
  // Attributes the server enforces on every write (spec 3.2). An empty string
  // or zero means the attribute is not set.
  // No two Records may hold the same value. Soft-deleted Records keep theirs.
  bool unique = 6;
  // Literal value used on create when the request omits the field.
  string default_value = 7;
  // Inclusive bounds as exact decimals (Number, Currency, Money, Quantity) or
  // YYYY-MM-DD dates (Date).
  string min = 8;
  string max = 9;
  // Regular expression (RE2 syntax) the whole value must match, for Text,
  // Long text and Phone fields.
  string pattern = 10;
  // Maximum characters, at most the type's own limit.
  int32 max_length = 11;
  // Writes may not change the value; only defaults set it.
  bool read_only = 12;
  // The value may be set once and never changed afterwards.
  bool set_once = 13;
  // Not copied when a Record is duplicated or amended.
  bool no_copy = 14;
  // Adds a database index.
  bool index = 15;
  // Choices, for Enum fields only.
  repeated EnumValue enum_values = 16;
  // ISO-style currency code such as USD, for Money fields only.
  string currency = 17;
  // Unit of measure key such as kg, for Quantity fields only.
  string uom = 18;
  // Money: minor-unit digits (2 for USD, 0 for JPY). Quantity: fraction
  // digits, at most 6, 6 when unset.
  optional int32 scale = 19;
  // Submittable documents and their child Records: the field may still change
  // after the document is submitted. Every change is audited.
  bool allow_on_submit = 20;
  // Expressions in the Athena expression language (spec 23.6, ADR-0013). The
  // fields are doc.<key> (or doc.<child record type>.<key> for the list of a
  // child Record Type's values in sum, min, max and count). Every expression
  // is type-checked when the Record Type is saved.
  //
  // formula calculates the field from the others. The kernel stores the
  // result on every write, in dependency order, so clients never set it. It
  // may not use today() and may not form a cycle.
  string formula = 21;
  // required_if makes the field required while it is true.
  string required_if = 22;
  // read_only_if blocks changes to the field while it is true for the stored
  // Record.
  string read_only_if = 23;
  // validate must be true whenever the field has a value.
  string validate = 24;
  // depends_on is a display hint: the desk hides the field while it is false.
  // The server does not enforce it.
  string depends_on = 25;
  // Field permission level, 0 to 9. A user whose highest permission level on
  // the Record Type is lower cannot see or change the field; their responses
  // leave it out and the Audit Log masks its values.
  int32 permission_level = 26;
}

message RecordType {
  // Lowercase snake_case key that names the table. Fixed once saved.
  string key = 1;
  string label = 2;
  string description = 3;
  repeated RecordTypeField fields = 4;
  // Zero for a Record Type that has never been saved.
  int64 revision = 5;
  // master, document, child or setting. Ledger, balance, log, snapshot and
  // meta Record Types are created by the kernel only. Empty means master.
  // Fixed once saved.
  string kind = 6;
  // For documents: posting, non_posting, work or batch.
  string class = 7;
  // For child Record Types: the key of the Master or Document that owns the
  // Records. Fixed once saved.
  string parent_record_type_key = 8;
  // Documents other than work documents only. A submittable document moves
  // draft, submitted, cancelled under kernel control (spec 5.1).
  bool submittable = 9;
  // Requires submittable. A cancelled document can be amended into a new draft.
  bool amendable = 10;
  // Submittable documents only: a naming series such as SINV-{yyyy}-{#####}
  // (spec 10.4, 24.3). The kernel assigns the next name when the document is
  // submitted; drafts keep a placeholder. Empty keeps the Record ID as name.
  string naming_series = 11;
  // Requires naming_series. True numbers inside the submit transaction under
  // a counter row lock, so a rolled-back submit leaves no gap. False takes the
  // number outside it, so numbers can skip but writers never wait.
  bool gap_free = 12;
  // Requires submittable. Lets a create request supply its own name.
  bool allow_manual_name = 13;
  // Key of the field whose value labels a Record in pickers. Empty uses the
  // document name, then the first required text field.
  string label_field = 14;
  // What the caller may do with this Record Type. Filled by ListRecordTypes;
  // ignored on save.
  RecordTypeAccess access = 15;
  // Number of Records in the Record Type's table. Filled by ListRecordTypes;
  // ignored on save.
  int64 record_count = 16;
  // True when the caller may see the Record Type but may not read its
  // Records, so record_count is 0 instead of the real number. Filled by
  // ListRecordTypes; ignored on save.
  bool count_hidden = 17;
  // RFC 3339 timestamp of the last completed save, from the journal. Empty
  // when the Record Type predates journal timestamps. Filled by
  // ListRecordTypes; ignored on save.
  string updated_at = 18;
  // Display name of who last saved the Record Type, or "Local administrator"
  // for command-line saves. Empty for saves that predate actor recording.
  // Filled by ListRecordTypes; ignored on save.
  string updated_by = 19;
  // Key of the Pack that installed the Record Type. Empty until Packs install
  // in C3; Workspace-authored Record Types also report empty. Filled by
  // ListRecordTypes; ignored on save.
  string pack_key = 20;
  // The form layout: sections of fields, text, images and art. Stored with
  // the definition; a layout-only save bumps the revision without touching
  // the table.
  FormLayout layout = 21;
}

// FormLayout arranges a Record Type's fields into titled sections. Fields
// the layout does not place are appended to the last section on save.
message FormLayout {
  repeated FormSection sections = 1;
}

message FormSection {
  string title = 1;
  string description = 2;
  // 1 or 2.
  int32 columns = 3;
  // CEL that returns true or false over the Record's fields; empty means the
  // section always shows. Display-only: the server type-checks it and never
  // enforces it.
  string visibility = 4;
  repeated FormLayoutItem items = 5;
}

message FormLayoutItem {
  oneof kind {
    FormFieldItem field = 1;
    FormTextBlock text = 2;
    FormImageBlock image = 3;
    FormArtBlock art = 4;
  }
}

message FormFieldItem {
  string field_key = 1;
  // full or half; empty means full.
  string width = 2;
  string help_text = 3;
}

message FormTextBlock {
  string text = 1;
}

// FormImageBlock shows a Workspace file from images/. The path must name a
// recorded image file when the layout saves.
message FormImageBlock {
  string path = 1;
}

// FormArtBlock shows one figure from the desk's art registry. The key is
// validated by the desk, which owns the registry.
message FormArtBlock {
  string key = 1;
}
// RecordTypeAccess is the caller's Grants on one Record Type, merged.
message RecordTypeAccess {
  // Any of read, create, write, delete, submit, cancel, amend, audit.
  repeated string actions = 1;
  // The highest field permission level the caller has on the Record Type.
  int32 permission_level = 2;
}

message ListRecordTypesRequest {}

message ListRecordTypesResponse {
  repeated RecordType record_types = 1;
}

message SaveRecordTypeRequest {
  RecordType record_type = 1;
  // The revision the client edited. Zero creates a new Record Type.
  int64 expected_revision = 2;
  // Must be true when the plan removes stored values (dropped fields or
  // values that cannot convert to a new type or link target).
  bool confirm_data_loss = 3;
  // Values written into empty Records for fields that become required,
  // keyed by field key.
  map<string, FieldValue> backfills = 4;
  // For a child Record Type: the new definition of its parent, saved in the
  // same request right after the child, so a rollup formula over a new or
  // changed child needs no second save. Its revision field is the parent
  // revision the client edited; the parent must already be saved once. The
  // pair is atomic: if the parent save fails, the child is rolled back and
  // the error names the parent.
  RecordType parent = 5;
}

message PlanRecordTypeSaveRequest {
  RecordType record_type = 1;
  int64 expected_revision = 2;
}

// MigrationStep is one change the save makes to the Record Type's table.
message MigrationStep {
  // create_table, add_field, remove_field, change_type, change_link,
  // require_field, add_unique, drop_unique, add_index, drop_index.
  string kind = 1;
  string field_key = 2;
  string description = 3;
  // True when the step deletes stored values.
  bool destructive = 4;
  // Records whose values this step deletes or must fill in.
  int64 affected_records = 5;
  // True when the step needs a value in backfills.
  bool needs_backfill = 6;
}

message PlanRecordTypeSaveResponse {
  repeated MigrationStep steps = 1;
  // True when SaveRecordType needs confirm_data_loss or backfills for this plan.
  bool requires_confirmation = 2;
}

message SaveRecordTypeResponse {
  RecordType record_type = 1;
  // The saved parent, when the request carried one.
  RecordType parent = 2;
}

message DeleteRecordTypeRequest {
  string key = 1;
  // The revision the client last saw.
  int64 expected_revision = 2;
  // Must be true when the Record Type has Records; they are deleted with it.
  bool delete_records = 3;
}

message DeleteRecordTypeResponse {}
