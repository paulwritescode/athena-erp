syntax = "proto3";
package athena.v1;
option go_package = "athena-erp/gen/athena/v1;athenav1";

import "athena/v1/records.proto";

// RecordTypeService reads and saves Record Types. Saving applies the Record
// Type's table changes and activates the new revision as one journaled
// operation.
service RecordTypeService {
  rpc ListRecordTypes(ListRecordTypesRequest) returns (ListRecordTypesResponse);
  // PlanRecordTypeSave describes the table migration a save would run,
  // without changing anything.
  rpc PlanRecordTypeSave(PlanRecordTypeSaveRequest) returns (PlanRecordTypeSaveResponse);
  rpc SaveRecordType(SaveRecordTypeRequest) returns (SaveRecordTypeResponse);
  // DeleteRecordType drops the Record Type's table with its Records and
  // removes the definition. It is refused while other Record Types link to it.
  rpc DeleteRecordType(DeleteRecordTypeRequest) returns (DeleteRecordTypeResponse);
}

message RecordTypeField {
  // Lowercase snake_case column key. Fixed once saved.
  string key = 1;
  string label = 2;
  // One of Text, Long text, Email, Phone, Number, Currency, Date, Select, Link, Checkbox.
  string type = 3;
  bool required = 4;
  // Key of the linked Record Type, for Link fields only.
  string target_record_type_key = 5;
}

message RecordType {
  // Lowercase snake_case key that names the table. Fixed once saved.
  string key = 1;
  string label = 2;
  string description = 3;
  repeated RecordTypeField fields = 4;
  // Zero for a Record Type that has never been saved.
  int64 revision = 5;
}

message ListRecordTypesRequest {}

message ListRecordTypesResponse {
  repeated RecordType record_types = 1;
}

message SaveRecordTypeRequest {
  RecordType record_type = 1;
  // The revision the client edited. Zero creates a new Record Type.
  int64 expected_revision = 2;
  // Must be true when the plan removes stored values (dropped fields or
  // values that cannot convert to a new type or link target).
  bool confirm_data_loss = 3;
  // Values written into empty Records for fields that become required,
  // keyed by field key.
  map<string, FieldValue> backfills = 4;
}

message PlanRecordTypeSaveRequest {
  RecordType record_type = 1;
  int64 expected_revision = 2;
}

// MigrationStep is one change the save makes to the Record Type's table.
message MigrationStep {
  // add_field, remove_field, change_type, change_link, require_field.
  string kind = 1;
  string field_key = 2;
  string description = 3;
  // True when the step deletes stored values.
  bool destructive = 4;
  // Records whose values this step deletes or must fill in.
  int64 affected_records = 5;
  // True when the step needs a value in backfills.
  bool needs_backfill = 6;
}

message PlanRecordTypeSaveResponse {
  repeated MigrationStep steps = 1;
  // True when SaveRecordType needs confirm_data_loss or backfills for this plan.
  bool requires_confirmation = 2;
}

message SaveRecordTypeResponse {
  RecordType record_type = 1;
}

message DeleteRecordTypeRequest {
  string key = 1;
  // The revision the client last saw.
  int64 expected_revision = 2;
  // Must be true when the Record Type has Records; they are deleted with it.
  bool delete_records = 3;
}

message DeleteRecordTypeResponse {}
