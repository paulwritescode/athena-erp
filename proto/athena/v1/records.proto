syntax = "proto3";
package athena.v1;
option go_package = "athena-erp/gen/athena/v1;athenav1";

// RecordService reads and writes Records. Each Record is one row in the table
// that belongs to its Record Type.
service RecordService {
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);
  rpc CreateRecord(CreateRecordRequest) returns (CreateRecordResponse);
  rpc UpdateRecord(UpdateRecordRequest) returns (UpdateRecordResponse);
  // DeleteRecord soft-deletes a Master Record (it keeps its row and is no
  // longer listed or readable) and removes Records of other kinds.
  rpc DeleteRecord(DeleteRecordRequest) returns (DeleteRecordResponse);
  // ListRecordHistory returns a Record's changes, newest first.
  rpc ListRecordHistory(ListRecordHistoryRequest) returns (ListRecordHistoryResponse);
}

// FieldValue carries one typed field value. Number and Currency use exact
// decimal strings, Date uses YYYY-MM-DD and Link uses the target Record ID.
message FieldValue {
  oneof kind {
    string string_value = 1;
    bool bool_value = 2;
    // Explicit null. Set to true to clear a field.
    bool null_value = 3;
  }
}

message Record {
  // UUIDv7 assigned by the server.
  string id = 1;
  // Incremented on each update. Send it back as expected_revision.
  int64 revision = 2;
  map<string, FieldValue> values = 3;
  // RFC 3339 timestamps.
  string created_at = 4;
  string updated_at = 5;
  // System fields the kernel sets (spec 24.1). Until sign-in exists the
  // actor is "Local administrator".
  string created_by = 6;
  string modified_by = 7;
  // The creating user; master and document Records only.
  string owner = 8;
  // Revision of the Record Type when this Record was last written.
  int64 def_version = 9;
  // Correlation ID of the last write request.
  string request_id = 10;
  // Child Records only: the owning Record's ID and the position among its
  // siblings.
  string parent_id = 11;
  int64 idx = 12;
}

message ListRecordsRequest {
  string record_type_key = 1;
  // Defaults to 50; capped at 200.
  int32 page_size = 2;
  // Opaque cursor from a previous response.
  string page_token = 3;
  // Child Record Types only: list the Records of this parent.
  string parent_id = 4;
}

message ListRecordsResponse {
  repeated Record records = 1;
  // Empty when there are no more Records.
  string next_page_token = 2;
}

message GetRecordRequest {
  string record_type_key = 1;
  string id = 2;
}

message GetRecordResponse {
  Record record = 1;
}

message CreateRecordRequest {
  string record_type_key = 1;
  map<string, FieldValue> values = 2;
  // Required for a child Record Type: the Record that owns the new Record.
  string parent_id = 3;
}

message CreateRecordResponse {
  Record record = 1;
}

// UpdateRecordRequest changes only the fields present in values.
message UpdateRecordRequest {
  string record_type_key = 1;
  string id = 2;
  int64 expected_revision = 3;
  map<string, FieldValue> values = 4;
}

message UpdateRecordResponse {
  Record record = 1;
}

message DeleteRecordRequest {
  string record_type_key = 1;
  string id = 2;
  int64 expected_revision = 3;
}

message DeleteRecordResponse {}

message ListRecordHistoryRequest {
  string record_type_key = 1;
  string id = 2;
}

// RecordEvent is one change to a Record.
message RecordEvent {
  // created, updated or deleted.
  string action = 1;
  // The Record revision after the change.
  int64 revision = 2;
  // Keys of the fields whose values changed.
  repeated string changed_fields = 3;
  // Who made the change. "Local administrator" until sign-in exists.
  string actor = 4;
  // RFC 3339 timestamp.
  string at = 5;
}

message ListRecordHistoryResponse {
  repeated RecordEvent events = 1;
}
