syntax = "proto3";
package athena.v1;
option go_package = "athena-erp/gen/athena/v1;athenav1";

// RecordService reads and writes Records. Each Record is one row in the table
// that belongs to its Record Type.
service RecordService {
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);
  rpc CreateRecord(CreateRecordRequest) returns (CreateRecordResponse);
  rpc UpdateRecord(UpdateRecordRequest) returns (UpdateRecordResponse);
  // DeleteRecord soft-deletes a Master Record (it keeps its row and is no
  // longer listed or readable) and removes Records of other kinds.
  rpc DeleteRecord(DeleteRecordRequest) returns (DeleteRecordResponse);
  // LookupRecords finds Records of one Record Type by display label, for
  // pickers of Link fields and parents. It lists only Records that can be
  // chosen now (not cancelled, not soft-deleted). With ids set it resolves
  // those Records instead, whatever their state.
  rpc LookupRecords(LookupRecordsRequest) returns (LookupRecordsResponse);
  // ListRecordHistory returns a Record's Audit Log rows, newest first.
  rpc ListRecordHistory(ListRecordHistoryRequest) returns (ListRecordHistoryResponse);
  // SubmitRecord moves a draft of a submittable document to submitted.
  rpc SubmitRecord(SubmitRecordRequest) returns (SubmitRecordResponse);
  // CancelRecord moves a submitted document to cancelled. It is refused while
  // a submitted document still links to it.
  rpc CancelRecord(CancelRecordRequest) returns (CancelRecordResponse);
  // AmendRecord creates a draft successor of a cancelled amendable document.
  rpc AmendRecord(AmendRecordRequest) returns (AmendRecordResponse);
  // ListRecordVersions returns a document's snapshots, newest first.
  rpc ListRecordVersions(ListRecordVersionsRequest) returns (ListRecordVersionsResponse);
  // ListRecordActivity returns a document's timeline, newest first.
  rpc ListRecordActivity(ListRecordActivityRequest) returns (ListRecordActivityResponse);
}

// FieldValue carries one typed field value. Number and Currency use exact
// decimal strings, Date uses YYYY-MM-DD and Link uses the target Record ID.
message FieldValue {
  oneof kind {
    string string_value = 1;
    bool bool_value = 2;
    // Explicit null. Set to true to clear a field.
    bool null_value = 3;
  }
}

message Record {
  // UUIDv7 assigned by the server.
  string id = 1;
  // Incremented on each update. Send it back as expected_revision.
  int64 revision = 2;
  map<string, FieldValue> values = 3;
  // RFC 3339 timestamps.
  string created_at = 4;
  string updated_at = 5;
  // System fields the kernel sets (spec 24.1). Until sign-in exists the
  // actor is "Local administrator".
  string created_by = 6;
  string modified_by = 7;
  // The creating user; master and document Records only.
  string owner = 8;
  // Revision of the Record Type when this Record was last written.
  int64 def_version = 9;
  // Correlation ID of the last write request.
  string request_id = 10;
  // Child Records only: the owning Record's ID and the position among its
  // siblings.
  string parent_id = 11;
  int64 idx = 12;
  // Submittable documents only: 0 draft, 1 submitted, 2 cancelled. Only the
  // kernel changes it.
  int32 docstate = 13;
  // Submittable documents only. Starts as the Record ID; an amended document
  // gets the original's name with a -1, -2 suffix.
  string name = 14;
  // Amendable documents only: the cancelled document this one replaces.
  string amended_from = 15;
}

message ListRecordsRequest {
  string record_type_key = 1;
  // Defaults to 50; capped at 200.
  int32 page_size = 2;
  // Opaque cursor from a previous response.
  string page_token = 3;
  // Child Record Types only: list the Records of this parent.
  string parent_id = 4;
}

message ListRecordsResponse {
  repeated Record records = 1;
  // Empty when there are no more Records.
  string next_page_token = 2;
}

message GetRecordRequest {
  string record_type_key = 1;
  string id = 2;
}

message GetRecordResponse {
  Record record = 1;
}

message CreateRecordRequest {
  string record_type_key = 1;
  map<string, FieldValue> values = 2;
  // Required for a child Record Type: the Record that owns the new Record.
  string parent_id = 3;
  // Submittable documents whose Record Type allows manual names only: the
  // name to use instead of a series number. It must be unused. Logged.
  string name = 4;
}

message CreateRecordResponse {
  Record record = 1;
}

// UpdateRecordRequest changes only the fields present in values.
message UpdateRecordRequest {
  string record_type_key = 1;
  string id = 2;
  int64 expected_revision = 3;
  map<string, FieldValue> values = 4;
}

message UpdateRecordResponse {
  Record record = 1;
}

message DeleteRecordRequest {
  string record_type_key = 1;
  string id = 2;
  int64 expected_revision = 3;
}

message DeleteRecordResponse {}

message ListRecordHistoryRequest {
  string record_type_key = 1;
  string id = 2;
}

// FieldChange is one field of an Audit Log row. Rows imported from the history
// that predates the Audit Log name the field only.
message FieldChange {
  string field = 1;
  optional string old_value = 2;
  optional string new_value = 3;
}
// RecordEvent is one Audit Log row of a Record.
message RecordEvent {
  // created, updated, deleted, submitted, cancelled or name_override.
  string action = 1;
  // The Record revision after the change.
  int64 revision = 2;
  // Keys of the fields whose values changed.
  repeated string changed_fields = 3;
  // Who made the change. "Local administrator" until sign-in exists.
  string actor = 4;
  // RFC 3339 timestamp.
  string at = 5;
  // Field-level changes with old and new values.
  repeated FieldChange changes = 6;
  // Correlates this row with the request that wrote it and the Records,
  // versions and activity of the same request.
  string request_id = 7;
  // api, cli, rule, import or job.
  string source = 8;
  // Position in the Audit Log chain, and the row's hash.
  int64 seq = 9;
  string hash = 10;
}
message ListRecordHistoryResponse {
  repeated RecordEvent events = 1;
}

message SubmitRecordRequest {
  string record_type_key = 1;
  string id = 2;
  int64 expected_revision = 3;
}
message SubmitRecordResponse {
  Record record = 1;
}
message CancelRecordRequest {
  string record_type_key = 1;
  string id = 2;
  int64 expected_revision = 3;
}
message CancelRecordResponse {
  Record record = 1;
}
message AmendRecordRequest {
  string record_type_key = 1;
  string id = 2;
  int64 expected_revision = 3;
}
// AmendRecordResponse carries the new draft.
message AmendRecordResponse {
  Record record = 1;
}
message ListRecordVersionsRequest {
  string record_type_key = 1;
  string id = 2;
}
// RecordVersion is a snapshot of a document taken at submit, cancel or amend.
message RecordVersion {
  // 1, 2, 3 ... within the document.
  int64 version = 1;
  // The Record revision the snapshot was taken at.
  int64 revision = 2;
  // submit, cancel or amend.
  string event = 3;
  int32 docstate = 4;
  // JSON text: the document's values and its child Records.
  string snapshot = 5;
  // JSON text: what changed since the previous version, empty for the first.
  string diff = 6;
  string actor = 7;
  string at = 8;
}
message ListRecordVersionsResponse {
  repeated RecordVersion versions = 1;
}
message ListRecordActivityRequest {
  string record_type_key = 1;
  string id = 2;
}
// ActivityEvent is one step in a document's timeline.
message ActivityEvent {
  // submitted, cancelled, amended, amended_from or edited_after_submit.
  string event = 1;
  string actor = 2;
  // Document states before and after, for state changes.
  int32 from_state = 3;
  int32 to_state = 4;
  // Keys of the fields changed, for edited_after_submit.
  repeated string changed_fields = 5;
  // The successor (amended) or the original (amended_from).
  string related_id = 6;
  string at = 7;
}
message ListRecordActivityResponse {
  repeated ActivityEvent events = 1;
}
message LookupRecordsRequest {
  string record_type_key = 1;
  // Case-insensitive text the label must contain. Empty lists everything.
  string query = 2;
  // Defaults to 20; capped at 50.
  int32 page_size = 3;
  // Opaque cursor from a previous response.
  string page_token = 4;
  // When set, query and paging are ignored and these Records (at most 50)
  // are returned whatever their state. A picker uses it to label the value a
  // Record already holds.
  repeated string ids = 5;
}
// LookupItem is one Record as a picker shows it. The ID is the stored value;
// people see the label.
message LookupItem {
  string id = 1;
  string label = 2;
  // Empty for a Record that can be chosen. cancelled or deleted for one that
  // can only be shown (ids lookups).
  string state = 3;
}
message LookupRecordsResponse {
  repeated LookupItem items = 1;
  // Empty when there are no more items.
  string next_page_token = 2;
}
