syntax = "proto3";

package athena.v1;

option go_package = "athena-erp/gen/athena/v1;athenav1";

// LedgerService owns the kernel's ledger masters (ADR-0022, Proposed):
// companies, branches, departments, cost centres, dimensions, fiscal years,
// periods, currencies, exchange rates, account types, accounts, determination
// mappings and Settings. Reading needs the ledger:read system permission;
// saving needs ledger:write. Nothing is seeded: jurisdiction, chart and tax
// stay open for the sponsor.
service LedgerService {
  rpc SaveCompany(SaveCompanyRequest) returns (SaveCompanyResponse);
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);
  rpc SaveBranch(SaveBranchRequest) returns (SaveBranchResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc SaveDepartment(SaveDepartmentRequest) returns (SaveDepartmentResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc SaveCostCentre(SaveCostCentreRequest) returns (SaveCostCentreResponse);
  rpc ListCostCentres(ListCostCentresRequest) returns (ListCostCentresResponse);
  rpc SaveDimension(SaveDimensionRequest) returns (SaveDimensionResponse);
  rpc ListDimensions(ListDimensionsRequest) returns (ListDimensionsResponse);
  rpc SaveFiscalYear(SaveFiscalYearRequest) returns (SaveFiscalYearResponse);
  rpc ListFiscalYears(ListFiscalYearsRequest) returns (ListFiscalYearsResponse);
  rpc SavePeriod(SavePeriodRequest) returns (SavePeriodResponse);
  rpc SetPeriodStatus(SetPeriodStatusRequest) returns (SetPeriodStatusResponse);
  rpc ListPeriods(ListPeriodsRequest) returns (ListPeriodsResponse);
  rpc SaveCurrency(SaveCurrencyRequest) returns (SaveCurrencyResponse);
  rpc ListCurrencies(ListCurrenciesRequest) returns (ListCurrenciesResponse);
  rpc SaveRate(SaveRateRequest) returns (SaveRateResponse);
  rpc GetRate(GetRateRequest) returns (GetRateResponse);
  rpc SaveAccountType(SaveAccountTypeRequest) returns (SaveAccountTypeResponse);
  rpc ListAccountTypes(ListAccountTypesRequest) returns (ListAccountTypesResponse);
  rpc SaveAccount(SaveAccountRequest) returns (SaveAccountResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc SaveDetermination(SaveDeterminationRequest) returns (SaveDeterminationResponse);
  rpc ListDeterminations(ListDeterminationsRequest) returns (ListDeterminationsResponse);
  rpc ResolveAccount(ResolveAccountRequest) returns (ResolveAccountResponse);
  rpc SaveSetting(SaveSettingRequest) returns (SaveSettingResponse);
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  rpc SaveSettingValue(SaveSettingValueRequest) returns (SaveSettingValueResponse);
  rpc PublishSettingValue(PublishSettingValueRequest) returns (PublishSettingValueResponse);
  rpc DiscardSettingValue(DiscardSettingValueRequest) returns (DiscardSettingValueResponse);
  rpc ListSettingValues(ListSettingValuesRequest) returns (ListSettingValuesResponse);
  rpc ResolveSetting(ResolveSettingRequest) returns (ResolveSettingResponse);
  rpc PreviewSettingChange(PreviewSettingChangeRequest) returns (PreviewSettingChangeResponse);
  rpc GetReadiness(GetReadinessRequest) returns (GetReadinessResponse);
  // PreviewPosting runs a voucher's posting Rules and returns the plans a
  // submit would write now, with the combined hash to approve (R6.14). It
  // writes nothing; the submit recalculates and refuses when the plan
  // changed (R6.15).
  rpc PreviewPosting(PreviewPostingRequest) returns (PreviewPostingResponse);
  // GetPostingStatus returns one voucher's posting groups with whether a
  // reversal unwound each.
  rpc GetPostingStatus(GetPostingStatusRequest) returns (GetPostingStatusResponse);
  // ListPostingLog returns one voucher's posting attempts, newest first.
  rpc ListPostingLog(ListPostingLogRequest) returns (ListPostingLogResponse);
  // ListLedgerRows returns one voucher's ledger rows in posting order.
  rpc ListLedgerRows(ListLedgerRowsRequest) returns (ListLedgerRowsResponse);
  // ApplySettlement applies one settlement voucher's lines to open items
  // (R7.2). Realised gains and losses post through the posting engine; the
  // response carries their group, empty when nothing posted.
  rpc ApplySettlement(ApplySettlementRequest) returns (ApplySettlementResponse);
  // ReverseSettlement unwinds one settlement voucher: every unreversed
  // application gains its cancel mirror in the current period (R7.6).
  rpc ReverseSettlement(ReverseSettlementRequest) returns (ReverseSettlementResponse);
  // ListOpenItems returns a party's open items in stable id order.
  rpc ListOpenItems(ListOpenItemsRequest) returns (ListOpenItemsResponse);
}

// Company tops one organisation tree.
message Company {
  string name = 1;
  string label = 2;
  string base_currency = 3;
  bool disabled = 4;
  int64 revision = 5;
}

message SaveCompanyRequest {
  Company company = 1;
  // The revision the client edited. Zero creates a company.
  int64 expected_revision = 2;
}

message SaveCompanyResponse {
  Company company = 1;
}

message ListCompaniesRequest {}

message ListCompaniesResponse {
  repeated Company companies = 1;
}

// Branch belongs to one company and nests for grouping.
message Branch {
  string name = 1;
  string label = 2;
  string company = 3;
  string parent = 4;
  bool is_group = 5;
  bool disabled = 6;
  int64 revision = 7;
}

message SaveBranchRequest {
  Branch branch = 1;
  int64 expected_revision = 2;
}

message SaveBranchResponse {
  Branch branch = 1;
}

message ListBranchesRequest {
  string company = 1;
}

message ListBranchesResponse {
  repeated Branch branches = 1;
}

// Department belongs to one company and optionally one branch, and nests.
message Department {
  string name = 1;
  string label = 2;
  string company = 3;
  string branch = 4;
  string parent = 5;
  bool is_group = 6;
  bool disabled = 7;
  int64 revision = 8;
}

message SaveDepartmentRequest {
  Department department = 1;
  int64 expected_revision = 2;
}

message SaveDepartmentResponse {
  Department department = 1;
}

message ListDepartmentsRequest {
  string company = 1;
}

message ListDepartmentsResponse {
  repeated Department departments = 1;
}

// CostCentre belongs to one company and nests.
message CostCentre {
  string name = 1;
  string label = 2;
  string company = 3;
  string parent = 4;
  bool is_group = 5;
  bool disabled = 6;
  int64 revision = 7;
}

message SaveCostCentreRequest {
  CostCentre cost_centre = 1;
  int64 expected_revision = 2;
}

message SaveCostCentreResponse {
  CostCentre cost_centre = 1;
}

message ListCostCentresRequest {
  string company = 1;
}

message ListCostCentresResponse {
  repeated CostCentre cost_centres = 1;
}

// DimensionDefinition names one analysis axis with its permitted members,
// the accounts that require it, and the dates it applies to.
message DimensionDefinition {
  string name = 1;
  string label = 2;
  repeated string members = 3;
  repeated string mandatory_for = 4;
  string valid_from = 5;
  string valid_to = 6;
  bool disabled = 7;
  int64 revision = 8;
}

message SaveDimensionRequest {
  DimensionDefinition dimension = 1;
  int64 expected_revision = 2;
}

message SaveDimensionResponse {
  DimensionDefinition dimension = 1;
}

message ListDimensionsRequest {}

message ListDimensionsResponse {
  repeated DimensionDefinition dimensions = 1;
}

// FiscalYear groups the periods of one company.
message FiscalYear {
  string name = 1;
  string label = 2;
  string company = 3;
  string start_date = 4;
  string end_date = 5;
  bool disabled = 6;
  int64 revision = 7;
}

message SaveFiscalYearRequest {
  FiscalYear fiscal_year = 1;
  int64 expected_revision = 2;
}

message SaveFiscalYearResponse {
  FiscalYear fiscal_year = 1;
}

message ListFiscalYearsRequest {
  string company = 1;
}

message ListFiscalYearsResponse {
  repeated FiscalYear fiscal_years = 1;
}

// Period is one posting window. Dates are inclusive YYYY-MM-DD; status is
// open, soft_closed or hard_closed.
message Period {
  string company = 1;
  string book = 2;
  string name = 3;
  string label = 4;
  string fiscal_year = 5;
  string start_date = 6;
  string end_date = 7;
  string status = 8;
  int64 revision = 9;
}

message SavePeriodRequest {
  Period period = 1;
  int64 expected_revision = 2;
}

message SavePeriodResponse {
  Period period = 1;
}

message SetPeriodStatusRequest {
  string company = 1;
  string book = 2;
  string name = 3;
  string status = 4;
  int64 expected_revision = 5;
}

message SetPeriodStatusResponse {
  Period period = 1;
}

message ListPeriodsRequest {
  string company = 1;
  string book = 2;
}

message ListPeriodsResponse {
  repeated Period periods = 1;
}

// Currency is a code with its minor-unit exponent.
message Currency {
  string code = 1;
  string label = 2;
  int32 exponent = 3;
  bool disabled = 4;
  int64 revision = 5;
}

message SaveCurrencyRequest {
  Currency currency = 1;
  int64 expected_revision = 2;
}

message SaveCurrencyResponse {
  Currency currency = 1;
}

message ListCurrenciesRequest {}

message ListCurrenciesResponse {
  repeated Currency currencies = 1;
}

// ExchangeRate converts one unit of from_code to rate units of to_code from
// its effective instant (RFC 3339). Rates are never updated.
message ExchangeRate {
  string from_code = 1;
  string to_code = 2;
  string rate_type = 3;
  string source = 4;
  string effective_at = 5;
  string rate = 6;
}

message SaveRateRequest {
  ExchangeRate rate = 1;
}

message SaveRateResponse {
  ExchangeRate rate = 1;
}

message GetRateRequest {
  string from_code = 1;
  string to_code = 2;
  string rate_type = 3;
  // Empty accepts every source and fails when they disagree.
  string source = 4;
  string at = 5;
}

message GetRateResponse {
  string rate = 1;
}

// AccountType names one account family with its normal balance side.
message AccountType {
  string name = 1;
  string label = 2;
  string normal_balance = 3;
}

message SaveAccountTypeRequest {
  AccountType account_type = 1;
}

message SaveAccountTypeResponse {
  AccountType account_type = 1;
}

message ListAccountTypesRequest {}

message ListAccountTypesResponse {
  repeated AccountType account_types = 1;
}

// Account is one chart node. Groups organise the tree; only leaves post.
// An empty company means every company.
message Account {
  string name = 1;
  string label = 2;
  string type = 3;
  string parent = 4;
  bool is_group = 5;
  string class = 6;
  string control_role = 7;
  string company = 8;
  bool disabled = 9;
  int64 revision = 10;
}

message SaveAccountRequest {
  Account account = 1;
  int64 expected_revision = 2;
}

message SaveAccountResponse {
  Account account = 1;
}

message ListAccountsRequest {
  string company = 1;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

// Determination maps a posting context to an account. Match holds
// dimension-name to value pairs; more pairs win, and equal winners fail.
message Determination {
  string id = 1;
  string label = 2;
  string account = 3;
  map<string, string> match = 4;
  bool disabled = 5;
  int64 revision = 6;
}

message SaveDeterminationRequest {
  Determination determination = 1;
  int64 expected_revision = 2;
}

message SaveDeterminationResponse {
  Determination determination = 1;
}

message ListDeterminationsRequest {}

message ListDeterminationsResponse {
  repeated Determination determinations = 1;
}

message ResolveAccountRequest {
  map<string, string> context = 1;
}

message ResolveAccountResponse {
  Determination determination = 1;
}

// Setting defines one owned setting: scalar or list values, and for lists
// the replace, append or intersect merge rule.
message Setting {
  string owner_pack = 1;
  string type = 2;
  string label = 3;
  string kind = 4;
  string list_rule = 5;
  int64 revision = 6;
}

message SaveSettingRequest {
  Setting setting = 1;
  int64 expected_revision = 2;
}

message SaveSettingResponse {
  Setting setting = 1;
}

message ListSettingsRequest {}

message ListSettingsResponse {
  repeated Setting settings = 1;
}

// SettingValue is one generation: JSON text in force for a scope chain from
// an instant (RFC 3339), draft until published.
message SettingValue {
  string owner_pack = 1;
  string type = 2;
  string scope_chain = 3;
  string effective_from = 4;
  int64 revision = 5;
  string value_json = 6;
  string status = 7;
}

message SaveSettingValueRequest {
  SettingValue value = 1;
}

message SaveSettingValueResponse {
  SettingValue value = 1;
}

message PublishSettingValueRequest {
  string owner_pack = 1;
  string type = 2;
  string scope_chain = 3;
  string effective_from = 4;
  int64 revision = 5;
}

message PublishSettingValueResponse {
  SettingValue value = 1;
}

message DiscardSettingValueRequest {
  string owner_pack = 1;
  string type = 2;
  string scope_chain = 3;
  string effective_from = 4;
  int64 revision = 5;
}

message DiscardSettingValueResponse {}

message ListSettingValuesRequest {
  string owner_pack = 1;
  string type = 2;
  bool published_only = 3;
}

message ListSettingValuesResponse {
  repeated SettingValue values = 1;
}

message ResolveSettingRequest {
  string owner_pack = 1;
  string type = 2;
  map<string, string> scope = 3;
  string at = 4;
}

message ResolveSettingResponse {
  // The effective value as JSON text.
  string value_json = 1;
  repeated SettingValue winners = 2;
}

message PreviewSettingChangeRequest {
  string owner_pack = 1;
  string type = 2;
  map<string, string> scope = 3;
  SettingValue draft = 4;
}

message SettingChange {
  string at = 1;
  string before_json = 2;
  string after_json = 3;
}

message PreviewSettingChangeResponse {
  repeated SettingChange changes = 1;
}

// ReadinessCheck is one setup completeness row: what was checked, whether it
// passed, and what to do when it did not.
message ReadinessCheck {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}

message GetReadinessRequest {
  string company = 1;
}

message GetReadinessResponse {
  repeated ReadinessCheck checks = 1;
}

// PostingPlanLine is one leg of a previewed plan with its resolved account.
message PostingPlanLine {
  string company = 1;
  string account = 2;
  string account_label = 3;
  string debit_base = 4;
  string credit_base = 5;
  string txn_currency = 6;
  string txn_debit = 7;
  string txn_credit = 8;
  // Empty when the leg has no quantity.
  string quantity = 9;
  string quantity_uom = 10;
  map<string, string> dimensions = 11;
  string source_type = 12;
  string source_id = 13;
}

// PostingPlan is what one posting Rule returns for a submit: the book, the
// date and the legs, with the Rule version that built it.
message PostingPlan {
  string rule_key = 1;
  int64 rule_version = 2;
  string book = 3;
  string posting_date = 4;
  repeated PostingPlanLine lines = 5;
}

message PreviewPostingRequest {
  string record_type_key = 1;
  string id = 2;
}

message PreviewPostingResponse {
  // The voucher revision previewed. The plans assume revision + 1, the
  // revision a submit now would assign, so plan_hash matches submit.
  int64 revision = 1;
  repeated PostingPlan plans = 2;
  // Combined hash of the plans; submit with it as posting_preview_hash to
  // prove the approval saw this exact plan (R6.15).
  string plan_hash = 3;
}

message GetPostingStatusRequest {
  string record_type_key = 1;
  string id = 2;
}

// PostingGroupStatus is one posted group: one voucher revision, event and
// book, with whether a reversal unwound it.
message PostingGroupStatus {
  int64 revision = 1;
  string event = 2;
  string book = 3;
  string posting_group_id = 4;
  int64 row_count = 5;
  // RFC 3339 time of the post.
  string posted_at = 6;
  bool reversed = 7;
  // The cancel group unwinding it, when reversed.
  string reversed_by = 8;
}

message GetPostingStatusResponse {
  repeated PostingGroupStatus groups = 1;
}

message ListPostingLogRequest {
  string record_type_key = 1;
  string id = 2;
  // Filter by outcome: posted, replayed, conflict, rejected or error. Empty
  // means any.
  string outcome = 3;
  int32 page_size = 4;
  // Opaque token from the previous page.
  string page_token = 5;
}

// PostingLogEntry is one posting attempt and its outcome.
message PostingLogEntry {
  string id = 1;
  int64 revision = 2;
  string event = 3;
  string book = 4;
  string operation_id = 5;
  string outcome = 6;
  string code = 7;
  string message = 8;
  string plan_hash = 9;
  string actor = 10;
  string request_id = 11;
  // RFC 3339 time of the attempt.
  string created_at = 12;
}

message ListPostingLogResponse {
  repeated PostingLogEntry entries = 1;
  string next_page_token = 2;
}

message ListLedgerRowsRequest {
  string record_type_key = 1;
  string id = 2;
  int32 page_size = 3;
  // Opaque token from the previous page.
  string page_token = 4;
}

// LedgerRow is one posted leg of a voucher.
message LedgerRow {
  string id = 1;
  string company = 2;
  string book = 3;
  string account = 4;
  string period = 5;
  string posting_date = 6;
  string debit_base = 7;
  string credit_base = 8;
  string txn_currency = 9;
  string txn_debit = 10;
  string txn_credit = 11;
  // Empty when the leg has no quantity.
  string quantity = 12;
  string quantity_uom = 13;
  map<string, string> dimensions = 14;
  int64 revision = 15;
  string event = 16;
  string posting_group_id = 17;
  bool is_reversal = 18;
  string reversed_row_id = 19;
}

message ListLedgerRowsResponse {
  repeated LedgerRow rows = 1;
  string next_page_token = 2;
}

// SettlementLineItem names one application target of a settlement line. An
// empty amount takes an automatic proportional share of the line remainder;
// a set amount applies exactly that much.
message SettlementLineItem {
  string item_id = 1;
  // Decimal in the payment currency; empty means automatic.
  string amount = 2;
}

// SettlementLine is one payment line with its target items in any order;
// items settle in stable id order.
message SettlementLine {
  int32 line_no = 1;
  // Decimal in the payment currency, above zero.
  string amount = 2;
  repeated SettlementLineItem items = 3;
}

// SettlementFX carries what a foreign-currency settlement needs: the
// exchange-rate type (and optional source) and the resolved gain and loss
// accounts. Absent means a base-currency settlement.
message SettlementFX {
  string rate_type = 1;
  string rate_source = 2;
  string gain_account = 3;
  string loss_account = 4;
}

message ApplySettlementRequest {
  string company = 1;
  string book = 2;
  string party_type = 3;
  string party_id = 4;
  string control_account = 5;
  // debit (receivable) or credit (payable).
  string side = 6;
  string voucher_type = 7;
  string voucher_id = 8;
  int64 revision = 9;
  // YYYY-MM-DD.
  string posting_date = 10;
  string payment_currency = 11;
  SettlementFX fx = 12;
  // Reason for a soft-closed adjustment; needs the ledger:close grant.
  string close_reason = 13;
  repeated SettlementLine lines = 14;
}

// SettlementApplication is one written settlement edge.
message SettlementApplication {
  string id = 1;
  int32 line_no = 2;
  string item_id = 3;
  // Decimals: the payment-currency share, the item-currency share and the
  // base value at the settlement rate.
  string payment_amount = 4;
  string item_amount = 5;
  string base_amount = 6;
}

// SettlementUnapplied is one line remainder recorded as unapplied cash.
message SettlementUnapplied {
  int32 line_no = 1;
  string amount = 2;
  string base_amount = 3;
  string party_row_id = 4;
}

message ApplySettlementResponse {
  repeated SettlementApplication applications = 1;
  repeated SettlementUnapplied unapplied = 2;
  // The realised-FX engine group, empty when nothing posted.
  string fx_group_id = 3;
}

message ReverseSettlementRequest {
  string company = 1;
  string book = 2;
  string party_type = 3;
  string party_id = 4;
  string control_account = 5;
  string side = 6;
  string voucher_type = 7;
  string voucher_id = 8;
  // The cancel revision to record.
  int64 revision = 9;
  // YYYY-MM-DD, the current date the mirrors land on.
  string posting_date = 10;
}

message ReverseSettlementResponse {
  repeated SettlementApplication applications = 1;
  repeated string fx_cancel_groups = 2;
}

// OpenItem is one open instalment row.
message OpenItem {
  string id = 1;
  string company = 2;
  string book = 3;
  string party_type = 4;
  string party_id = 5;
  string control_account = 6;
  string source_voucher_type = 7;
  string source_voucher_id = 8;
  int64 source_voucher_revision = 9;
  int32 instalment_no = 10;
  string due_date = 11;
  string currency = 12;
  string side = 13;
  string original_amount = 14;
  string residual_amount = 15;
  string status = 16;
  int64 revision = 17;
}

message ListOpenItemsRequest {
  string company = 1;
  string book = 2;
  string party_type = 3;
  string party_id = 4;
}

message ListOpenItemsResponse {
  repeated OpenItem items = 1;
}
