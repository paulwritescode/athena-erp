syntax = "proto3";
package athena.v1;
option go_package = "athena-erp/gen/athena/v1;athenav1";
// AuthService signs users in and out and manages users, Roles and Grants
// (spec 21, ADR-0014, access model v2 in ADR-0017). Login, GetSession and
// CompleteChallenge are the only methods open to callers who are not signed
// in. Every other method in every service is denied unless the permission
// gate allows it.
service AuthService {
  // Login checks a username and password and starts a session. The session
  // token travels only in an HttpOnly, SameSite=Strict cookie; the response
  // carries the CSRF token the desk sends in X-CSRF-Token on later calls.
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc StepUp(StepUpRequest) returns (StepUpResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // GetSession reports whether the caller is signed in. A missing cookie is anonymous.
  // A presented, ended session returns its expiry or revocation reason.
  // It never extends idle: the desk's "Stay signed in" uses Touch for that.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // Touch extends the caller's idle expiry to a full window from now and
  // returns the fresh session. The desk calls it only when the user answers
  // the idle warning; background polls stay on the passive GetSession.
  rpc Touch(TouchRequest) returns (TouchResponse);
  // ChangePassword sets the caller's own password and ends their sessions.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // InviteUser invites a user with no password and returns the single-use
  // Challenge to show once. It needs access:users.
  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse);
  // CompleteChallenge consumes a first-login or reset Challenge, stores the
  // chosen password and starts a session. It is open: the Challenge is the
  // credential.
  rpc CompleteChallenge(CompleteChallengeRequest) returns (CompleteChallengeResponse);
  // ResendInvite invalidates an invited user's earlier Challenges and issues
  // a new one, returned to show once. It needs access:users.
  rpc ResendInvite(ResendInviteRequest) returns (ResendInviteResponse);
  // StartReset moves an active user to reset_required, revokes their
  // sessions and issues a reset Challenge to show once. It needs
  // access:recover and the caller's own password.
  rpc StartReset(StartResetRequest) returns (StartResetResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // ResetPassword is retired: administrator-set passwords are removed, so it
  // always fails. Start a reset instead.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  // SaveRole creates or replaces the Role with the given name and its Grants.
  rpc SaveRole(SaveRoleRequest) returns (SaveRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  // ListAssignments returns a user's Role Assignments. It needs access:assign.
  rpc ListAssignments(ListAssignmentsRequest) returns (ListAssignmentsResponse);
  // SaveAssignment creates an Assignment or replaces one whose revision still
  // matches. It needs access:assign.
  rpc SaveAssignment(SaveAssignmentRequest) returns (SaveAssignmentResponse);
  // RevokeAssignment deletes one Assignment. It needs access:assign.
  rpc RevokeAssignment(RevokeAssignmentRequest) returns (RevokeAssignmentResponse);
  // ExplainAccess reports which Assignment allows an action or why each one
  // fails. It needs access:explore.
  rpc ExplainAccess(ExplainAccessRequest) returns (ExplainAccessResponse);
  // ListSessions lists sessions: the caller's own, or another user's with
  // access:sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // RevokeSession ends one session. It needs access:sessions to end another
  // user's session.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // TransferOwnership appoints the recipient an Instance Owner and, when
  // asked, relinquishes the caller's own ownership. It needs
  // access:ownership and the caller's own password.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
  // ListRoleHolders lists the users holding the Role with a Grant covering
  // the action on the Record Type. It needs access:roles.
  rpc ListRoleHolders(ListRoleHoldersRequest) returns (ListRoleHoldersResponse);
  // ListAccessLog reads the Access Log. It needs the audit permission.
  rpc ListAccessLog(ListAccessLogRequest) returns (ListAccessLogResponse);
  // GetSecuritySettings returns every Workspace security setting with its
  // current value, default, bounds, unit and a one-line explanation. It
  // needs access:sessions or settings:security.
  rpc GetSecuritySettings(GetSecuritySettingsRequest) returns (GetSecuritySettingsResponse);
  // SetSecuritySettings changes named security settings atomically. It
  // needs settings:security and fresh step-up proof.
  rpc SetSecuritySettings(SetSecuritySettingsRequest) returns (SetSecuritySettingsResponse);
}
message LoginRequest {
  string username = 1;
  string password = 2;
  bool remember_device = 3;
}
message LoginResponse {
  SessionInfo session = 1;
}
message StepUpRequest { string password = 1; }
message StepUpResponse { SessionInfo session = 1; }
message LogoutRequest {}
message LogoutResponse {}
message GetSessionRequest {}
message GetSessionResponse {
  SessionInfo session = 1;
  // False until the first user exists. The desk then tells the person to run
  // "athena user create --owner" instead of showing a sign-in form.
  bool has_users = 2;
}
message TouchRequest {}
message TouchResponse {
  SessionInfo session = 1;
}
// SessionInfo describes a signed-in user. It is empty when nobody is signed in.
message SessionInfo {
  bool authenticated = 1;
  string username = 2;
  string display_name = 3;
  bool owner = 4;
  // Any of build, audit, files:read, files:write, rules:read, rules:write,
  // access:ownership, access:users, access:roles, access:assign,
  // access:recover, access:sessions, access:explore.
  repeated string system_permissions = 5;
  // Send this in the X-CSRF-Token header on every call.
  string csrf_token = 6;
  string idle_expires_at = 7;
  string expires_at = 8;
}
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}
message ChangePasswordResponse {}
message AccessUser {
  string username = 1;
  string display_name = 2;
  bool owner = 3;
  bool disabled = 4;
  bool locked = 5;
  // Names of the user's Roles.
  repeated string roles = 6;
  string last_login_at = 7;
  // invited, active, reset_required or suspended.
  string state = 8;
}
message ListUsersRequest {}
message ListUsersResponse {
  repeated AccessUser users = 1;
}
message InviteUserRequest {
  string username = 1;
  string display_name = 2;
  repeated string roles = 3;
}
message InviteUserResponse {
  AccessUser user = 1;
  // The single-use first-login Challenge, shown once.
  string challenge = 2;
}
message CompleteChallengeRequest {
  string username = 1;
  // first_login or reset.
  string purpose = 2;
  string challenge = 3;
  string new_password = 4;
}
message CompleteChallengeResponse {
  SessionInfo session = 1;
}
message ResendInviteRequest {
  string username = 1;
}
message ResendInviteResponse {
  AccessUser user = 1;
  // The single-use first-login Challenge, shown once.
  string challenge = 2;
}
message StartResetRequest {
  string username = 1;
  // The caller's own password, proving a privileged recovery.
  string actor_password = 2;
}
message StartResetResponse {
  AccessUser user = 1;
  // The single-use reset Challenge, shown once.
  string challenge = 2;
}
message CreateUserRequest {
  reserved 3;
  reserved "password";
  string username = 1;
  string display_name = 2;
  repeated string roles = 4;
}
message CreateUserResponse {
  AccessUser user = 1;
}
message UpdateUserRequest {
  string username = 1;
  // Each optional property is left alone when absent.
  optional string display_name = 2;
  optional bool disabled = 3;
  // Replaces the user's Roles when present, even if empty.
  optional RoleNames roles = 4;
  // Clears a lockout.
  bool unlock = 5;
}
message RoleNames {
  repeated string names = 1;
}
message UpdateUserResponse {
  AccessUser user = 1;
}
message ResetPasswordRequest {
  reserved 2;
  reserved "new_password";
  string username = 1;
}
message ResetPasswordResponse {}
// ScopeValues holds the allowed values of one Scope dimension.
message ScopeValues {
  repeated string values = 1;
}
// Assignment is one Role given to one user with its own Scope and dates.
message Assignment {
  string id = 1;
  string role = 2;
  // Dimension name to allowed values. Empty means every row.
  map<string, ScopeValues> scope = 3;
  // Whole days, YYYY-MM-DD. Empty means unbounded.
  string active_from = 4;
  string expires_at = 5;
  int64 revision = 6;
}
message ListAssignmentsRequest {
  string username = 1;
}
message ListAssignmentsResponse {
  repeated Assignment assignments = 1;
}
message SaveAssignmentRequest {
  string username = 1;
  Assignment assignment = 2;
}
message SaveAssignmentResponse {
  Assignment assignment = 1;
}
message RevokeAssignmentRequest {
  string id = 1;
}
message RevokeAssignmentResponse {}
message ExplainAccessRequest {
  string username = 1;
  string action = 2;
  string record_type_key = 3;
  // When set, row conditions and Scopes are tested against this Record.
  string record_id = 4;
}
// AssignmentExplanation reports why one Assignment allows an action or why
// it fails. Reasons are fixed phrases such as "no covering Grant",
// "outside dates", "Scope misses the required company" or "row condition
// false".
message AssignmentExplanation {
  string assignment_id = 1;
  string role = 2;
  bool matched = 3;
  repeated string reasons = 4;
  bool separate_duties_conflict = 5;
}
message ExplainAccessResponse {
  bool allowed = 1;
  repeated AssignmentExplanation assignments = 2;
}
// Session is one signed-in session.
message Session {
  string id = 1;
  string created_at = 2;
  string last_seen_at = 3;
  string expires_at = 4;
  string device = 5;
  // True for the session making the call.
  bool current = 6;
}
message ListSessionsRequest {
  // Empty lists the caller's own sessions.
  string username = 1;
}
message ListSessionsResponse {
  repeated Session sessions = 1;
}
message RevokeSessionRequest {
  string id = 1;
}
message RevokeSessionResponse {}
message TransferOwnershipRequest {
  string username = 1;
  // The caller's own password, proving a privileged ownership change.
  string actor_password = 2;
  // Also end the caller's own ownership Assignments.
  bool relinquish = 3;
}
message TransferOwnershipResponse {
  AccessUser user = 1;
}
message ListRoleHoldersRequest {
  string role = 1;
  string record_type_key = 2;
  string action = 3;
}
// RoleHolder is one user whose Assignment of the Role covers the action.
// Usable means the dates cover today and the Scope satisfies the Role; row
// conditions and Scope matching still apply per Record.
message RoleHolder {
  string username = 1;
  string display_name = 2;
  string state = 3;
  bool usable = 4;
  map<string, ScopeValues> scope = 5;
  string active_from = 6;
  string expires_at = 7;
}
message ListRoleHoldersResponse {
  repeated RoleHolder holders = 1;
}
// Grant allows actions on one Record Type. Grants are additive; no Grant
// means deny.
message Grant {
  // A Record Type key, or * for every Record Type.
  string record_type_key = 1;
  // read, create, write, delete, submit, cancel, amend or audit.
  repeated string actions = 2;
  // 0 to 9: the highest field permission level the Grant reaches.
  int32 permission_level = 3;
  // Expression a Record must satisfy for the Grant to apply, in the filter
  // language of ListRecords. user.name stands for the signed-in username.
  // Empty means every Record.
  string condition = 4;
  // Stops a user from submitting a Record they created.
  bool separate_duties = 5;
}
message Role {
  string name = 1;
  string description = 2;
  // Any of build, audit, files:read, files:write, rules:read, rules:write,
  // access:ownership, access:users, access:roles, access:assign,
  // access:recover, access:sessions, access:explore.
  repeated string system_permissions = 3;
  repeated Grant grants = 4;
}
message ListRolesRequest {}
message ListRolesResponse {
  repeated Role roles = 1;
}
message SaveRoleRequest {
  Role role = 1;
}
message SaveRoleResponse {
  Role role = 1;
}
message DeleteRoleRequest {
  string name = 1;
}
message DeleteRoleResponse {}
message ListAccessLogRequest {
  int32 page_size = 1;
  // Returns rows with a smaller ID, for paging back in time.
  int64 before_id = 2;
  // Optional event filter such as login_failed or denied.
  string event = 3;
}
// AccessEvent is one Access Log row. It holds identifiers and outcome codes
// only, never a password, a token or a Record value.
message AccessEvent {
  int64 id = 1;
  string at = 2;
  string event = 3;
  string outcome = 4;
  string username = 5;
  string procedure = 6;
  string record_type_key = 7;
  string action = 8;
  string request_id = 9;
  string detail = 10;
}
message ListAccessLogResponse {
  repeated AccessEvent events = 1;
}
// SecuritySetting is one Workspace security setting with the metadata the
// Desk shows beside its value.
message SecuritySetting {
  string key = 1;
  int32 value = 2;
  int32 default_value = 3;
  int32 min_value = 4;
  int32 max_value = 5;
  string unit = 6;
  string description = 7;
}
message GetSecuritySettingsRequest {}
message GetSecuritySettingsResponse {
  repeated SecuritySetting settings = 1;
}
message SetSecuritySettingsRequest {
  // Named keys to change; every key is validated before any is stored.
  map<string, int32> settings = 1;
}
message SetSecuritySettingsResponse {
  // Every setting after the change.
  repeated SecuritySetting settings = 1;
}

// AuthFailure is attached as an error detail to an authentication, session,
// step-up or rate-limit failure the server may describe: locked and disabled
// are sent only when the correct password was given, so they reveal nothing
// to someone guessing names.
message AuthFailure {
  // locked, disabled, csrf, idle, absolute, revoked, step_up_required or rate_limited.
  string reason = 1;
  // RFC 3339 time a lock ends; empty for a disabled account.
  string unlocks_at = 2;
  uint32 retry_after_seconds = 3;
}
