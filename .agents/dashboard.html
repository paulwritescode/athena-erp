<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Athena beta · live map</title>
<style>
:root{
  color-scheme:dark;
  --bg:#141418;--panel:#1c1c22;--card:#22222a;--card2:#282832;--line:#34343f;--text:#ececf1;--muted:#9898a6;--faint:#5d5d6b;
  --merged:#3fb97f;--running:#f5b83d;--waiting:#c98d2e;--review:#4cc3e0;--started:#7b8cff;--todo:#5d5d6b;--error:#ef5b5b;--master:#c9a6ff;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:13px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;letter-spacing:.02em;white-space:nowrap}
header .pill,header .toggle{white-space:nowrap}
header{gap:10px}
.pill{padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);font-size:12px}
.pill.warn{background:#3a2a12;color:var(--running)}
.pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--merged);margin-right:6px;animation:pulse 1.6s infinite}
header .sp{flex:1}
input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 10px;width:200px;min-width:120px}
.toggle{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.toggle.report{border-color:var(--master);color:var(--master)}
.md h1,.md h2{font-size:14px;margin:18px 0 6px}.md p{margin:6px 0}.md code{font:11px "JetBrains Mono",monospace;background:var(--bg);padding:0 4px;border-radius:4px}
.toggle.on{border-color:var(--review);color:var(--review)}
#stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:default;min-width:0}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--faint)}
.stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.stat .v small{font-size:12px;color:var(--muted);font-weight:400}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .6s ease-out}
.stat .sub{color:var(--muted);font-size:11px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#secs{display:flex;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.sec{flex:1;min-width:150px}
.sec .row{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}
.sec .row b{color:var(--text);font-weight:500}
main{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;inset:0;cursor:grab;background-image:radial-gradient(#2a2a33 1px,transparent 1px);background-size:22px 22px}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.group{position:absolute;border:1px dashed var(--line);border-radius:16px;background:#1a1a2055}
.group .gh{position:absolute;left:14px;top:10px;display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.group .gh b{color:var(--text);font-weight:600}
.group .gbar{position:absolute;left:14px;right:14px;top:32px}
.sub-h{position:absolute;font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.node{position:absolute;width:260px;height:118px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;cursor:pointer;
  transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .3s,border-color .3s,box-shadow .3s;will-change:transform;overflow:hidden}
.node::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.node:hover{box-shadow:0 0 0 1px var(--c),0 10px 30px #0008}
.node.sel{box-shadow:0 0 0 2px var(--c),0 10px 30px #000a}
.node.dim{opacity:.28}
.node.flash{animation:flash 1.4s ease-out}
.node .top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.node .id{font-family:"JetBrains Mono",ui-monospace,monospace;color:var(--text);background:var(--card2);border-radius:5px;padding:0 5px}
.node .st{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--c);font-weight:500}
.node .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.node.running .dot,.node.agent.working .dot{animation:pulse 1.2s infinite}
.node .title{font-weight:600;margin:5px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .about{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:34px}
.node .foot{position:absolute;left:14px;right:12px;bottom:8px;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden}
.av{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border-radius:999px;padding:1px 7px 1px 3px;color:var(--text)}
.av .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px}
.ai{width:1.15em;height:1.15em;vertical-align:-.2em}
.av .ic .ai{width:12px;height:12px}
.node.agent .big .ai{width:22px;height:22px}
.node.agent.working .big{box-shadow:0 0 0 2px var(--running);animation:pulse 1.2s infinite}
.logo{position:relative;display:inline-grid;place-items:center;width:100%;height:100%;color:var(--text)}
.logo img{width:64%;height:64%}.logo img.mono,img.ai.mono{filter:invert(1)}
.logo .badge{position:absolute;right:-5px;bottom:-5px;width:15px;height:15px;border-radius:50%;background:var(--panel);border:1px solid var(--t);display:grid;place-items:center}
.logo .badge .ai{width:10px;height:10px}
.av .ic{width:18px;height:18px;background:var(--card)}.av .ic .badge{display:none}
.node.agent .cli{font-weight:400;font-size:11px;color:var(--muted);margin-left:4px}
.mini{display:inline-block;width:16px;height:16px;vertical-align:-3px}.mini.lg{width:22px;height:22px;vertical-align:-5px}.mini .badge{display:none}
.node.agent{height:96px}
.node.agent .big{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--card2);float:left;margin:4px 10px 0 0}
.port{position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--card);border:1.5px solid var(--faint)}
.port.in{left:-6px}.port.out{right:-6px}
path.e{fill:none;stroke:#4a4a58;stroke-width:1.5;transition:opacity .3s,stroke .3s}
path.e.done{stroke:#2f5d48}
path.e.hl-in{stroke:var(--started);stroke-width:2.4;opacity:1}
path.e.hl-out{stroke:var(--running);stroke-width:2.4;opacity:1}
path.e.dim{opacity:.08}
path.e.agent{stroke:#6c5a8f;stroke-width:1.6}
path.e.agent.live{stroke:var(--running);stroke-dasharray:7 6;animation:flow .6s linear infinite}
#legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap;max-width:70%}
#legend span{display:flex;align-items:center;gap:5px}
#legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
#hint{position:absolute;right:12px;bottom:12px;color:var(--faint);font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
aside.wide{width:760px}
aside{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .24s ease-out;display:flex;flex-direction:column;z-index:5}
aside.open{transform:none}
aside .ah{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
aside .ah h2{margin:0;font-size:16px;flex:1}
aside .x{background:none;border:0;cursor:pointer;font-size:18px;color:var(--muted)}
aside .ab{padding:14px 16px;overflow:auto;flex:1}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
aside ul{margin:0;padding-left:18px}aside li{margin:3px 0}
aside pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;white-space:pre-wrap;font:11px/1.45 "JetBrains Mono",ui-monospace,monospace;color:#c8c8d4;max-height:260px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;cursor:pointer;font-size:12px}
.chip:hover{border-color:var(--faint)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:12px}.kv div:nth-child(odd){color:var(--muted)}
details summary{cursor:pointer;color:var(--review);margin:6px 0}
.err{border-left:3px solid var(--error);background:#2a1719;padding:6px 8px;border-radius:6px;margin:6px 0;font:11px/1.45 "JetBrains Mono",ui-monospace,monospace}
.err b{font-family:Inter,sans-serif;color:var(--error)}
#fatal{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#2a1719;border:1px solid var(--error);color:var(--error);padding:8px 12px;border-radius:8px;z-index:6}

/* ---------- operations panel ---------- */
.split{flex:1;display:flex;min-height:0}
.split main{flex:1}
#ops{width:420px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;transition:width .24s ease-out}
#ops.closed{width:0;border:0;overflow:hidden}
#ops nav{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
#ops nav button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:7px 4px 8px;color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap}
#ops nav button:hover{color:var(--text)}
#ops nav button.on{color:var(--text);border-color:var(--master)}
#ops nav .n{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--card2);font-size:10px;color:var(--muted)}
#ops nav .n.hot{background:var(--running);color:#000}
#opsBody{flex:1;overflow:auto;padding:10px 12px 16px}
.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:18px;border-left:1px dashed var(--line);margin-left:15px}
.tn{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:9px;cursor:pointer;margin:2px 0}
.tn:hover{background:var(--card)}
.tn .lg{width:28px;height:28px;flex:none;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.tn .who{flex:1;min-width:0}
.tn .who b{font-weight:600}.tn .who small{color:var(--muted);margin-left:6px}
.tn .who div{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.sdot.working{background:var(--running);animation:pulse 1.2s infinite}.sdot.idle,.sdot.done{background:var(--merged)}.sdot.blocked{background:var(--error)}
.lane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.lane h4{margin:0 0 2px;font-size:13px;display:flex;gap:8px;align-items:center}
.lane h4 .id{font:11px "JetBrains Mono",monospace;background:var(--card2);padding:0 5px;border-radius:5px;color:var(--muted)}
.lane p{margin:0 0 8px;color:var(--muted);font-size:11px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chain .tk{border:1px solid var(--c);color:var(--text);border-radius:7px;padding:1px 7px;font-size:11px;cursor:pointer;background:color-mix(in srgb,var(--c) 14%,transparent)}
.chain .tk.cur{box-shadow:0 0 0 2px var(--c)}
.chain .ar{color:var(--faint);font-size:10px}
.lane .ags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.msg{border-left:3px solid var(--k);padding:6px 9px;margin:6px 0;background:var(--card);border-radius:0 8px 8px 0}
.msg .mh{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.msg .mh b{color:var(--text);font-weight:600}.msg .mh .kd{color:var(--k);font-weight:600;margin-left:auto}
.msg .mt{margin-top:3px;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:7.5em;overflow:hidden}
.msg.open .mt{max-height:none}
.msg.undelivered{opacity:.6}
.filt{display:flex;gap:6px;margin-bottom:8px}
.filt select{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px}
.upd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.upd .mh{font-size:11px;color:var(--muted);display:flex;gap:8px}.upd .mt{margin-top:4px;white-space:pre-wrap;font-size:12px}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.res div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.res b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.res small{color:var(--muted);font-size:11px}
.sr{display:flex;gap:8px;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.sr .ok{color:var(--merged)}.sr .bad{color:var(--error)}.sr .t{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--faint);padding:20px 4px;text-align:center}
#opsToggle.on{border-color:var(--master);color:var(--master)}
.pill.bad{background:#2a1719;color:var(--error)}
@keyframes pulse{50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-13}}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--c),0 0 40px var(--c)}100%{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header>
  <h1>Athena beta · Stylus</h1>
  <span class="pill live" id="clock">connecting…</span>
  <span class="pill" id="main"></span>
  <span class="pill warn" id="unpushed" hidden></span>
  <span class="sp"></span>
  <input type="search" id="q" placeholder="Find a task, agent or branch">
  <button class="toggle on" id="tDeps" title="Show dependency arrows">Dependencies</button>
  <span class="pill" id="res" title="Free memory, free disk and live agents against the caps"></span>
  <button class="toggle on" id="opsToggle" title="Team, lanes, messages, updates and the suite queue">Operations</button>
  <button class="toggle report" id="tReport" title="What happened during the night shift">🌙 Night report</button>
  <button class="toggle" id="tDone" title="Show arrows between merged tasks too">Merged arrows</button>
</header>
<section id="stats"></section>
<section id="secs"></section>
<div class="split">
<main>
  <div id="stage"><div id="world"><svg id="edges"><defs>
    <marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#4a4a58"/></marker>
    <marker id="a-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f5d48"/></marker>
    <marker id="a-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7b8cff"/></marker>
    <marker id="a-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#f5b83d"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6c5a8f"/></marker>
  </defs></svg></div></div>
  <div id="legend"></div>
  <div id="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit to screen">⤢</button></div>
  <div id="hint">click a node for details · scroll to zoom · drag to pan · double-click to fit</div>
  <div id="fatal"></div>
  <aside id="drawer"><div class="ah"><h2 id="dTitle"></h2><button class="x" id="dClose" title="Close">✕</button></div><div class="ab" id="dBody"></div></aside>
</main>
<section id="ops"><nav id="opsNav"></nav><div id="opsBody"></div></section>
</div>

<script>
const STATES = {
  running: {label: "Working now", color: "var(--running)", icon: "▶"},
  waiting: {label: "Agent idle", color: "var(--waiting)", icon: "◔"},
  review:  {label: "In review / ready to merge", color: "var(--review)", icon: "◆"},
  started: {label: "Started, no agent", color: "var(--started)", icon: "◐"},
  todo:    {label: "Not started", color: "var(--todo)", icon: "○"},
  merged:  {label: "Done · merged to main", color: "var(--merged)", icon: "✔"},
};
const SECNAME = {A: "Foundation", B: "Platform", C: "Kernel", D: "Product", E: "Beta release"};
const SVGP = {
  stylus: '<path d="M12 19l7-7 3 3-7 7z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/>',
  master: '<circle cx="12" cy="12" r="10"/><path d="M16.2 7.8l-2 6.3-6.4 2.1 2-6.3z"/>',
  worker: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/><circle cx="12" cy="3.2" r="1"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/><path d="M2 14h2M20 14h2"/>',
  reviewer: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8.5 11l2 2 3.5-4"/>',
  submaster: '<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  subworker: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
  thinker: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'};
const TINT = {stylus: "var(--review)", master: "var(--master)", worker: "var(--running)", reviewer: "var(--started)", submaster: "#e889c4", subworker: "#f0a35e", thinker: "#8fd3a8"};
const ROLEWORD = {stylus: "Stylus", master: "Master", worker: "Worker", reviewer: "Reviewer", submaster: "Submaster", subworker: "Subworker", thinker: "Thinker"};
const JOB = {stylus: "plans and reasons, delegates to master", master: "runs the lanes, reviews, merges, closes panes", worker: "builds one task", reviewer: "reviews a task branch, read-only", submaster: "splits a big task and integrates the parts", subworker: "builds one part of a split task", thinker: "read-only analysis for Stylus"};
const MONO = new Set(["muse", "agent", "zsh", "sh", "bash", "cat"]);
const CLINAME = {muse: "Muse Spark", kiro: "Kiro CLI", "kiro-cli": "Kiro CLI", codex: "Codex", claude: "Claude Code"};
const LOGO = a => `<span class="logo" style="--t:${TINT[a.role] || "var(--muted)"}"><img class="${MONO.has(a.cli || "agent") ? "mono" : ""}" src="/icon/${encodeURIComponent((a.cli || "agent").replace("-cli", ""))}.svg" alt="${esc(CLINAME[a.cli] || a.cli || "agent")}"><span class="badge">${ICON[a.role]}</span></span>`;
const ICON = new Proxy({}, {get: (_, r) => `<svg class="ai" viewBox="0 0 24 24" fill="none" stroke="${TINT[r] || "currentColor"}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SVGP[r] || SVGP.worker}</svg>`});
const NW = 260, NH = 118, AH = 96, GAP = 18, COLGAP = 110, PAD = 22, HEAD = 56;
let S = null, sel = null, nodes = {}, prev = {}, pos = {}, firstFit = true;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const opts = {deps: true, doneEdges: false, q: ""};

/* ---------- layout: groups are columns, nodes keep their id so they glide between groups ---------- */
function layout(st) {
  const groups = [];
  const tasks = st.tasks;
  const done = tasks.filter(t => t.state === "merged");
  const active = tasks.filter(t => ["running", "waiting", "review", "started"].includes(t.state))
    .sort((a, b) => ["running", "review", "waiting", "started"].indexOf(a.state) - ["running", "review", "waiting", "started"].indexOf(b.state));
  const agents = treeOrder(st);
  groups.push({key: "done", label: "Done · merged", color: "var(--merged)", items: done, bySec: true});
  groups.push({key: "agents", label: "Agents", color: "var(--master)", items: agents, agents: true});
  groups.push({key: "active", label: "In progress", color: "var(--running)", items: active});
  for (const k of Object.keys(SECNAME)) {
    const items = tasks.filter(t => t.sec === k && t.state === "todo");
    if (items.length) groups.push({key: "todo-" + k, label: "To do · " + k + " " + SECNAME[k], color: "var(--todo)", items, sec: k});
  }
  let x = 0;
  const out = {groups: [], pos: {}, subs: []};
  for (const g of groups) {
    let y = HEAD, w = NW + PAD * 2;
    if (g.bySec) {
      for (const k of Object.keys(SECNAME)) {
        const items = g.items.filter(t => t.sec === k);
        if (!items.length) continue;
        out.subs.push({x: x + PAD, y: y, text: k + " · " + SECNAME[k] + " (" + items.length + ")"});
        y += 20;
        for (const t of items) { out.pos[t.id] = {x: x + PAD, y, h: NH}; y += NH + GAP; }
        y += 6;
      }
    } else {
      for (const it of g.items) {
        const id = g.agents ? "ag:" + it.addr : it.id, h = g.agents ? AH : NH;
        out.pos[id] = {x: x + PAD, y, h}; y += h + GAP;
      }
    }
    if (!g.items.length) y += 60;
    out.groups.push({...g, x, y: 0, w, h: y + PAD - GAP + 8});
    x += w + COLGAP;
  }
  out.width = x; out.height = Math.max(...out.groups.map(g => g.h)) + 40;
  return out;
}

/* ---------- rendering ---------- */
function bar(parts) { return '<div class="bar">' + parts.map(([v, c]) => `<i style="width:${v}%;background:${c}"></i>`).join("") + "</div>"; }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }

function renderStats(st) {
  const T = st.tasks.length, c = k => st.tasks.filter(t => t.state === k).length;
  const merged = c("merged"), run = c("running"), wait = c("waiting"), rev = c("review"), start = c("started"), todo = c("todo");
  const inprog = run + wait + rev + start;
  const working = st.workers.filter(w => w.status === "working").length;
  const unmergedTasks = st.tasks.filter(t => t.state !== "merged" && (t.ahead || t.dirty)).length;
  $("stats").innerHTML = `
  <div class="stat"><div class="k">Overall progress</div><div class="v">${pct(merged, T)}% <small>${merged} of ${T} tasks done</small></div>
    ${bar([[pct(merged, T), "var(--merged)"], [pct(rev, T), "var(--review)"], [pct(run + wait, T), "var(--running)"], [pct(start, T), "var(--started)"]])}
    <div class="sub">green done · blue review · yellow working · violet started</div></div>
  <div class="stat"><div class="k">Remaining</div><div class="v">${T - merged} <small>${todo} not started</small></div>
    ${bar([[pct(T - merged, T), "var(--todo)"]])}<div class="sub">${inprog} already in progress</div></div>
  <div class="stat"><div class="k">In progress</div><div class="v">${inprog} <small>${run} working now</small></div>
    ${bar([[pct(run, inprog), "var(--running)"], [pct(wait, inprog), "var(--waiting)"], [pct(rev, inprog), "var(--review)"], [pct(start, inprog), "var(--started)"]])}
    <div class="sub">${run} working · ${wait} idle · ${rev} ready to merge · ${start} parked</div></div>
  <div class="stat"><div class="k">Merged to main</div><div class="v">${merged} <small>· ${unmergedTasks} with unmerged work</small></div>
    ${bar([[pct(merged, merged + unmergedTasks), "var(--merged)"], [pct(unmergedTasks, merged + unmergedTasks), "var(--running)"]])}
    <div class="sub">branches not in main: ${st.branches.unmerged.length ? esc(st.branches.unmerged.join(", ")) : "none"}</div></div>
  <div class="stat"><div class="k">Agents</div><div class="v">${st.workers.length + st.master.length} <small>${working} working</small></div>
    ${bar([[pct(working, st.workers.length), "var(--running)"], [pct(st.workers.length - working, st.workers.length), "var(--merged)"]])}
    <div class="sub">${["worker", "reviewer", "submaster", "subworker"].map(r => `${ICON[r]} ${st.workers.filter(w => w.role === r).length}`).join(" · ")} <span style="color:var(--faint)">workers · reviewers · sub</span></div></div>
  <div class="stat click" id="errStat" title="Show errors"><div class="k">Errors seen</div><div class="v" style="color:${st.errors.length ? "var(--error)" : "var(--merged)"}">${st.errors.length} <small>${st.errors.length ? "click to see" : "none"}</small></div>
    ${bar([[st.errors.length ? 100 : 0, "var(--error)"]])}<div class="sub">${st.errors.length ? esc(st.errors[st.errors.length - 1].who + ": " + st.errors[st.errors.length - 1].text) : "test failures, BLOCKED, panics, crashed terminals"}</div></div>`;
  $("errStat").onclick = showErrors;
  $("secs").innerHTML = st.sections.map(s => `<div class="sec"><div class="row"><b>${s.key} · ${esc(s.name)}</b><span>${s.merged}/${s.total} done${s.active ? " · " + s.active + " active" : ""}</span></div>
    ${bar([[pct(s.merged, s.total), "var(--merged)"], [pct(s.active, s.total), "var(--running)"]])}</div>`).join("");
  $("clock").textContent = "live · " + st.time;
  $("main").textContent = "main " + st.main;
  $("unpushed").hidden = !st.unpushed;
  $("unpushed").textContent = st.unpushed + " commit" + (st.unpushed === 1 ? "" : "s") + " on main not pushed";
  $("legend").innerHTML = Object.entries(STATES).map(([k, v]) => `<span><i style="background:${v.color}"></i>${v.icon} ${v.label}</span>`).join("") +
    `<span>${ICON.stylus} Stylus</span><span>${ICON.master} master</span><span>${ICON.worker} worker</span><span>${ICON.reviewer} reviewer</span><span>${ICON.submaster} submaster</span><span>${ICON.subworker} subworker</span><span><img class="ai" src="/icon/kiro.svg" alt=""> Kiro</span><span><img class="ai mono" src="/icon/muse.svg" alt=""> Muse</span><span><svg width="26" height="8"><path d="M0,4H20" stroke="#7b8cff" stroke-width="2"/><path d="M18,0L26,4L18,8z" fill="#7b8cff"/></svg> needs</span><span><svg width="26" height="8"><path d="M0,4H20" stroke="#f5b83d" stroke-width="2"/><path d="M18,0L26,4L18,8z" fill="#f5b83d"/></svg> unlocks</span>`;
}

function agentById(st, addr) { return [...st.master, ...st.workers].find(a => a.addr === addr); }

function taskHTML(t, st) {
  const S_ = STATES[t.state];
  const ags = (t.agents || []).map(a => agentById(st, a)).filter(Boolean)
    .map(a => `<span class="av" title="${esc(a.name)} ${esc(a.status)}"><span class="ic">${LOGO(a)}</span>${esc(a.addr)} ${esc(a.status)}</span>`).join("");
  let foot = ags;
  if (t.branch) foot += `<span title="branch">⎇ ${esc(t.branch.replace(/^feat\//, ""))}</span>`;
  if (t.ahead) foot += `<span title="commits not in main">+${t.ahead}</span>`;
  if (t.dirty) foot += `<span title="uncommitted files">✎ ${t.dirty}</span>`;
  if (t.state === "todo" && t.blockedBy.length) foot += `<span title="waiting for these">⧗ after ${esc(t.blockedBy.join(", "))}</span>`;
  else if (t.state === "todo") foot += `<span style="color:var(--merged)">ready to start</span>`;
  if (!foot && t.owner) foot = `<span>${esc(t.owner)}</span>`;
  return `<div class="top"><span class="id">${esc(t.id)}</span><span>${esc(SECNAME[t.sec] || t.sec)}</span><span class="st"><span class="dot"></span>${S_.icon} ${esc(t.state === "merged" ? "done" : S_.label.toLowerCase())}</span></div>
    <div class="title" title="${esc(t.title)}">${esc(t.title)}</div><div class="about">${esc(t.about)}</div><div class="foot">${foot}</div>
    <span class="port in"></span><span class="port out"></span>`;
}

function agentHTML(a) {
  const role = a.role;
  const status = a.role === "stylus" ? "reasoning" : a.role === "master" ? (a.status || "orchestrating") : a.status;
  const task = (a.task ? "→ " + a.task + (a.parent && !["stylus", "master"].includes(a.role) ? " · from " + a.parent : "") : JOB[a.role] || "no task");
  return `<div class="big">${LOGO(a)}</div><div class="top"><span class="id">${esc(a.addr)}</span><span>${ROLEWORD[role] || role}</span><span class="st"><span class="dot"></span>${esc(status)}</span></div>
    <div class="title">${esc(a.role === "stylus" ? "Stylus" : a.role === "master" ? "Master" : a.name)} <span class="cli">${esc(CLINAME[a.cli] || a.cli || "")}</span></div><div class="about" style="height:auto">${esc(task)}</div>
    <span class="port in"></span><span class="port out"></span>`;
}

function draw(st) {
  S = st;
  renderStats(st);
  const L = layout(st);
  const world = $("world");
  world.style.width = L.width + "px"; world.style.height = L.height + "px";
  world.querySelectorAll(".group,.sub-h").forEach(e => e.remove());
  for (const g of L.groups) {
    const el = document.createElement("div");
    el.className = "group";
    Object.assign(el.style, {left: g.x + "px", top: g.y + "px", width: g.w + "px", height: g.h + "px", borderColor: g.color});
    const n = g.items.length;
    let extra = "";
    if (g.sec) { const s = st.sections.find(s => s.key === g.sec); extra = `${s.merged}/${s.total} done`; }
    el.innerHTML = `<div class="gh"><b style="color:${g.color}">${esc(g.label)}</b><span>${n}</span><span>${extra}</span></div>`;
    world.prepend(el);
  }
  for (const s of L.subs) {
    const el = document.createElement("div"); el.className = "sub-h"; el.textContent = s.text;
    Object.assign(el.style, {left: s.x + "px", top: s.y + "px"}); world.appendChild(el);
  }
  const seen = new Set();
  const place = (id, cls, html, color, p) => {
    seen.add(id);
    let el = nodes[id];
    const isNew = !el;
    if (isNew) {
      el = document.createElement("div");
      el.onclick = e => { e.stopPropagation(); select(id); };
      el.style.transform = `translate(${p.x}px,${p.y + 30}px)`; el.style.opacity = 0;
      world.appendChild(el); nodes[id] = el;
      requestAnimationFrame(() => el.style.opacity = 1);
    }
    el.className = "node " + cls + (sel === id ? " sel" : "");
    el.style.setProperty("--c", color);
    el.style.height = p.h + "px";
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
    requestAnimationFrame(() => el.style.transform = `translate(${p.x}px,${p.y}px)`);
  };
  for (const a of treeOrder(st)) {
    const id = "ag:" + a.addr;
    const color = a.status === "working" && !["stylus", "master"].includes(a.role) ? "var(--running)" : TINT[a.role] || "var(--merged)";
    place(id, "agent " + (a.status || ""), agentHTML(a), color, L.pos[id]);
  }
  for (const t of st.tasks) {
    place(t.id, t.state, taskHTML(t, st), STATES[t.state].color, L.pos[t.id]);
    if (prev[t.id] && prev[t.id] !== t.state) { nodes[t.id].classList.remove("flash"); void nodes[t.id].offsetWidth; nodes[t.id].classList.add("flash"); }
    prev[t.id] = t.state;
  }
  for (const id of Object.keys(nodes)) if (!seen.has(id)) { nodes[id].remove(); delete nodes[id]; }
  pos = L.pos;
  drawEdges(st, L);
  applyFilter();
  if (firstFit) { fit(); firstFit = false; }
  if (sel && $("drawer").classList.contains("open") && sel.startsWith("ag:")) showAgent(sel.slice(3), true);
}

function curve(a, b) {
  const x1 = a.x + NW, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
  if (x2 > x1 + 10) { const dx = Math.max(50, (x2 - x1) / 2); return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2 - 2},${y2}`; }
  // same column or backwards: loop out to the right and come back in from the left
  const r = 60, xa = x1 + r, xb = x2 - r;
  return `M${x1},${y1} C${xa + 40},${y1} ${xa + 40},${(y1 + y2) / 2} ${(xa + xb) / 2},${(y1 + y2) / 2} S${xb - 40},${y2} ${x2 - 2},${y2}`;
}

function drawEdges(st, L) {
  const svg = $("edges");
  svg.setAttribute("width", L.width); svg.setAttribute("height", L.height);
  svg.querySelectorAll("path.e").forEach(e => e.remove());
  const byId = Object.fromEntries(st.tasks.map(t => [t.id, t]));
  const add = (d, cls, marker, data) => {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); p.setAttribute("class", "e " + cls); p.setAttribute("marker-end", `url(#${marker})`);
    Object.assign(p.dataset, data); svg.appendChild(p);
  };
  if (opts.deps) for (const [a, b] of st.edges) {
    if (!L.pos[a] || !L.pos[b]) continue;
    const bothDone = byId[a].state === "merged" && byId[b].state === "merged";
    if (bothDone && !opts.doneEdges && sel !== a && sel !== b) continue;
    add(curve(L.pos[a], L.pos[b]), bothDone ? "done" : "", bothDone ? "a-d" : "a-n", {from: a, to: b});
  }
  const all = [...st.master, ...st.workers], byName = Object.fromEntries(all.map(a => [a.role === "stylus" ? "stylus" : a.name, a]));
  const mus = st.master.find(m => m.role === "master");
  for (const c of all) {
    if (c.role === "stylus") continue;
    const p = byName[c.parent] || (c.role === "master" ? byName.stylus : mus || byName.stylus);
    if (!p || p === c) continue;
    const A = L.pos["ag:" + p.addr], B = L.pos["ag:" + c.addr];
    if (A && B) add(`M${A.x + 20},${A.y + A.h} C${A.x + 20},${B.y + B.h / 2} ${A.x + 20},${B.y + B.h / 2} ${B.x - 2},${B.y + B.h / 2}`,
      "agent" + (c.status === "working" ? " live" : ""), "a-g", {from: "ag:" + p.addr, to: "ag:" + c.addr});
  }
  for (const w of st.workers) if (w.task && L.pos[w.task] && L.pos["ag:" + w.addr]) {
    add(curve(L.pos["ag:" + w.addr], L.pos[w.task]), "agent" + (w.status === "working" ? " live" : ""), "a-g", {from: "ag:" + w.addr, to: w.task});
  }
  highlight();
}

function highlight() {
  const edges = [...document.querySelectorAll("path.e")];
  edges.forEach(p => {
    p.classList.remove("hl-in", "hl-out", "dim");
    const m = p.getAttribute("marker-end");
    if (p._m) p.setAttribute("marker-end", p._m);
    if (!sel) return;
    if (p.dataset.to === sel) { p._m = m; p.classList.add("hl-in"); p.setAttribute("marker-end", "url(#a-i)"); }
    else if (p.dataset.from === sel) { p._m = m; p.classList.add("hl-out"); p.setAttribute("marker-end", "url(#a-o)"); }
    else p.classList.add("dim");
  });
  Object.entries(nodes).forEach(([id, el]) => el.classList.toggle("sel", id === sel));
}

function applyFilter() {
  const q = opts.q.trim().toLowerCase();
  for (const [id, el] of Object.entries(nodes)) {
    const t = S.tasks.find(t => t.id === id), a = id.startsWith("ag:") ? agentById(S, id.slice(3)) : null;
    const text = t ? [t.id, t.title, t.about, t.branch, t.state, ...(t.agents || [])].join(" ") : a ? [a.addr, a.name, a.status, a.task].join(" ") : "";
    el.classList.toggle("dim", !!q && !text.toLowerCase().includes(q));
  }
}

/* ---------- details drawer ---------- */
function openDrawer(title, html, wide) { $("drawer").classList.toggle("wide", !!wide); $("dTitle").innerHTML = title; $("dBody").innerHTML = html; $("drawer").classList.add("open"); }
$("dClose").onclick = () => { $("drawer").classList.remove("open"); sel = null; highlight(); drawEdges(S, layout(S)); };
function chips(ids) { return ids.length ? '<div class="chips">' + ids.map(i => `<span class="chip" data-go="${esc(i)}">${esc(i)} ${S.tasks.find(t => t.id === i)?.state === "merged" ? "✔" : ""}</span>`).join("") + "</div>" : '<span style="color:var(--faint)">none</span>'; }
$("dBody").addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) select(g.dataset.go, true); });

function select(id, center) {
  sel = id; drawEdges(S, layout(S));
  if (center && pos[id]) { const r = $("stage").getBoundingClientRect(); view.x = r.width / 2 - 220 - (pos[id].x + NW / 2) * view.k; view.y = r.height / 2 - (pos[id].y + 50) * view.k; apply(); }
  if (id.startsWith("ag:")) showAgent(id.slice(3)); else showTask(id);
}

async function showTask(id) {
  const t = S.tasks.find(t => t.id === id); if (!t) return;
  const S_ = STATES[t.state];
  openDrawer(`<span style="color:${S_.color}">${S_.icon}</span> ${esc(t.id)} · ${esc(t.title)}`, `<p>${esc(t.about)}</p><p style="color:var(--faint)">loading details…</p>`);
  const d = await (await fetch("/detail?id=" + encodeURIComponent(id))).json();
  if (sel !== id) return;
  const ags = (t.agents || []).map(a => agentById(S, a)).filter(Boolean);
  const wt = d.worktree;
  openDrawer(`<span style="color:${S_.color}">${S_.icon}</span> ${esc(t.id)} · ${esc(t.title)}`, `
    <div class="kv">
      <div>Status</div><div style="color:${S_.color}">${S_.label}</div>
      <div>Group</div><div>${esc(t.sec)} · ${esc(SECNAME[t.sec])}</div>
      <div>Owner</div><div>${esc(d.owner || "—")}</div>
      <div>Agents</div><div>${ags.length ? ags.map(a => `<span class="chip" data-agent="${esc(a.addr)}"><span class="mini">${LOGO(a)}</span> ${esc(a.name)} · ${esc(a.status)}</span>`).join(" ") : "none"}</div>
      <div>Branch</div><div>${wt ? esc(wt.branch) : "—"}</div>
      <div>Worktree</div><div>${wt ? esc(wt.worktree.split("/").pop()) : "—"}</div>
      <div>Not in main</div><div>${wt ? `${wt.ahead} commits · ${wt.dirty} uncommitted · ${wt.untracked} untracked` : "—"}</div>
      <div>Last commit</div><div>${wt ? esc(wt.last) : "—"}</div>
    </div>
    <h3>What it is</h3><p>${esc(d.summary && d.summary.length > 25 ? d.summary : d.about)}</p>
    ${d.points.length ? `<h3>Scope</h3><ul>${d.points.filter(p => !/^accept/i.test(p)).map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    ${d.accept.length ? `<h3>Done when</h3><ul>${d.accept.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    <h3>Needs first</h3>${chips(d.needs)}
    <h3>Unlocks</h3>${chips(d.unlocks)}
    ${d.commits.length ? `<h3>Commits not in main</h3><pre>${esc(d.commits.join("\n"))}</pre>` : ""}
    ${d.changed.length ? `<h3>Uncommitted changes</h3><pre>${esc(d.changed.join("\n"))}</pre>` : ""}
    ${ags.map(a => a.tail && a.tail.length ? `<h3>${ICON[a.role]} ${esc(a.name)} screen (last lines)</h3><pre>${esc(a.tail.join("\n"))}</pre>` : "").join("")}
    ${S.errors.filter(e => e.task === t.id).length ? `<h3>Errors</h3>` + S.errors.filter(e => e.task === t.id).map(e => `<div class="err"><b>${esc(e.who)}</b> ${esc(e.text)}</div>`).join("") : ""}
    ${d.files.length ? `<h3>Briefs, reports and reviews</h3>` + d.files.map(f => `<details><summary>${esc(f.path)}</summary><pre>${esc(f.head)}</pre></details>`).join("") : ""}`);
  $("dBody").querySelectorAll("[data-agent]").forEach(c => c.onclick = () => select("ag:" + c.dataset.agent, true));
}

function showAgent(addr, refresh) {
  const a = agentById(S, addr); if (!a) return;
  const isMaster = S.master.some(m => m.addr === addr);
  const role = a.role;
  const html = isMaster ? `
    <div class="kv"><div>Terminal</div><div>${esc(a.addr)}</div><div>Folder</div><div>${esc(a.cwd)}</div>
    <div>Workers</div><div>${S.workers.length} (${S.workers.filter(w => w.status === "working").length} working)</div></div>
    <h3>Agents</h3><div class="chips">${S.workers.map(w => `<span class="chip" data-agent="${esc(w.addr)}"><span class="mini">${LOGO(w)}</span> ${esc(w.name)} · ${esc(w.status)}${w.task ? " → " + esc(w.task) : ""}</span>`).join("")}</div>
    <h3>Job</h3><p>${role === "stylus" ? "Stylus does the reasoning and planning, and hands the actioning to the master." : "Briefs and starts workers and reviewers in split panes, merges passing branches into main, closes finished panes, keeps the night log and report."}</p>
    <h3>Screen (last lines)</h3><pre>${esc((a.tail || []).join("\n") || "(empty)")}</pre>${thread(role === "stylus" ? "stylus" : a.name)}` : `
    <div class="kv"><div>Terminal</div><div>${esc(a.addr)}</div><div>Role</div><div>${ROLEWORD[role] || role} · ${esc(CLINAME[a.cli] || a.cli || "")}</div><div>Status</div><div>${esc(a.status)}</div>
    <div>Reports to</div><div>${esc(a.parent || "master")}</div><div>Lane</div><div>${esc(a.lane || "")}</div>
    <div>Turn</div><div>${a.turn}</div><div>Task</div><div>${a.task ? `<span class="chip" data-go="${esc(a.task)}">${esc(a.task)}</span>` : "none"}</div><div>Folder</div><div>${esc(a.cwd.split("/").pop())}</div></div>
    <h3>Screen (last lines, refreshes live)</h3><pre>${esc((a.tail || []).join("\n") || "(empty)")}</pre>
    ${thread(a.role === "stylus" ? "stylus" : a.name)}
    ${S.errors.filter(e => e.who === a.name).length ? `<h3>Errors on its screen</h3>` + S.errors.filter(e => e.who === a.name).map(e => `<div class="err">${esc(e.text)}</div>`).join("") : ""}`;
  if (refresh) { $("dBody").innerHTML = html; } else openDrawer(`<span class="mini lg">${LOGO(a)}</span> ${esc(role === "stylus" ? "Stylus" : role === "master" ? "Master" : a.name)} · ${esc(a.addr)}`, html);
  $("dBody").querySelectorAll("[data-agent]").forEach(c => c.onclick = () => select("ag:" + c.dataset.agent, true));
}

function md(text) {
  const lines = String(text || "").split("\n"); let out = "", list = false;
  const inl = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  for (const l of lines) {
    if (/^\s*[-*] /.test(l)) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inl(l.replace(/^\s*[-*] /, "")) + "</li>"; continue; }
    if (list) { out += "</ul>"; list = false; }
    if (/^#{1,3} /.test(l)) out += "<h2>" + inl(l.replace(/^#+ /, "")) + "</h2>";
    else if (l.trim()) out += "<p>" + inl(l) + "</p>";
  }
  return out + (list ? "</ul>" : "");
}

async function showReport() {
  sel = null; highlight();
  openDrawer("🌙 Night report", "<p>loading…</p>", true);
  const r = await (await fetch("/report", {cache: "no-store"})).json();
  const T = S.tasks.length, merged = S.tasks.filter(t => t.state === "merged").length;
  const start = r.shift.startEpoch ? new Date(r.shift.startEpoch * 1000) : null;
  const hrs = start ? ((Date.now() - start) / 3.6e6).toFixed(1) : "?";
  const c = k => r.counts[k] || 0;
  openDrawer("🌙 Night report", `
    <div class="kv"><div>Shift started</div><div>${start ? esc(start.toLocaleString()) : "—"} (${hrs} h ago)</div>
    <div>Main at start</div><div>${esc(r.shift.mainAtStart || "—")} → now ${esc(S.main)}</div>
    <div>Commits to main</div><div>${r.commits.length}${r.diffstat ? " · " + esc(r.diffstat) : ""}</div>
    <div>Tasks finished</div><div>${r.tasksDone.length} tonight · ${merged}/${T} overall</div>
    <div>Agents</div><div>${c("STARTED")} started · ${c("CLOSED")} closed · ${c("REVIEW PASS")} reviews passed · ${c("NEEDS_CHANGES")} sent back</div>
    <div>Problems</div><div>${c("BLOCKED")} blocked · ${c("ERROR")} errors · ${c("QUESTION")} questions for you</div></div>
    <h3>Progress tonight</h3>${bar([[100 * (merged - r.tasksDone.length) / T, "var(--faint)"], [100 * r.tasksDone.length / T, "var(--merged)"]])}
    <div style="color:var(--muted);font-size:11px;margin-top:4px">grey: done before the shift · green: done tonight</div>
    ${r.tasksDone.length ? `<h3>Finished tonight</h3><ul>${r.tasksDone.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    <h3>Report from the master</h3><div class="md">${md(r.report) || "<p>No report yet.</p>"}</div>
    ${r.commits.length ? `<h3>Commits merged to main</h3><pre>${esc(r.commits.join("\n"))}</pre>` : ""}
    <h3>Full night log</h3><pre>${esc(r.log || "empty")}</pre>`, true);
}
$("tReport").onclick = showReport;

function showErrors() {
  sel = null; highlight();
  openDrawer(`<span style="color:var(--error)">⚠</span> Errors seen`, S.errors.length
    ? S.errors.slice().reverse().map(e => `<div class="err"><b>${esc(e.who)}${e.task ? " · " + esc(e.task) : ""}</b><br>${esc(e.text)}</div>`).join("")
    : "<p>No errors on any agent screen and no crashed terminals.</p>");
}

/* ---------- pan and zoom ---------- */
const view = {x: 0, y: 0, k: 1};
function apply() { $("world").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }
function fit() {
  const r = $("stage").getBoundingClientRect(), w = parseFloat($("world").style.width), h = parseFloat($("world").style.height);
  view.k = Math.min(1.2, (r.width - 40) / w, (r.height - 70) / h); view.x = 20; view.y = 16; apply();
}
function zoomAt(f, mx, my) { view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f; view.k *= f; apply(); }
const stage = $("stage");
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect();
  if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX)) zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; apply(); } }, {passive: false});
let drag = null;
stage.addEventListener("pointerdown", e => { if (e.target.closest(".node")) return; drag = {x: e.clientX - view.x, y: e.clientY - view.y, moved: false}; stage.classList.add("drag"); });
addEventListener("pointermove", e => { if (drag) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; drag.moved = true; apply(); } });
addEventListener("pointerup", () => { drag = null; stage.classList.remove("drag"); });
stage.addEventListener("dblclick", e => { if (!e.target.closest(".node")) fit(); });
$("zin").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); };
$("zout").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); };
$("zfit").onclick = fit;
$("q").oninput = e => { opts.q = e.target.value; applyFilter(); };
$("tDeps").onclick = e => { opts.deps = !opts.deps; e.target.classList.toggle("on", opts.deps); drawEdges(S, layout(S)); };
$("tDone").onclick = e => { opts.doneEdges = !opts.doneEdges; e.target.classList.toggle("on", opts.doneEdges); drawEdges(S, layout(S)); };
addEventListener("keydown", e => { if (e.key === "Escape") $("dClose").click(); });

/* ---------- polling ---------- */

function thread(who) {
  const ms = ((S.ops || {}).comms || []).filter(m => m.from === who || m.to === who).slice(-12).reverse();
  return ms.length ? `<h3>Messages</h3>` + ms.map(m => `<div class="msg open" style="--k:${KIND[m.kind] || "var(--muted)"}"><div class="mh"><b>${esc(m.from)}</b>→<b>${esc(m.to)}</b><span>${hhmm(m.ts)}</span><span class="kd">${esc(m.kind)}</span></div><div class="mt">${esc(m.text.replace(/^[A-Z_]+:\s*/, ""))}</div></div>`).join("") : "";
}
/* ---------- agent tree ---------- */
function treeOrder(st) {
  const all = [...st.master, ...st.workers];
  const key = a => a.role === "stylus" ? "stylus" : a.name;
  const names = new Set(all.map(key));
  const mus = st.master.find(m => m.role === "master");
  const parentOf = a => a.role === "stylus" ? null : names.has(a.parent) ? a.parent : a.role === "master" ? "stylus" : mus ? "master" : "stylus";
  const kids = {};
  for (const a of all) { const p = parentOf(a); (kids[p] = kids[p] || []).push(a); }
  const rank = {master: 0, worker: 1, submaster: 2, subworker: 3, reviewer: 4, thinker: 5};
  const out = [], walk = (p, d) => (kids[p] || []).sort((x, y) => (rank[x.role] ?? 9) - (rank[y.role] ?? 9) || x.name.localeCompare(y.name))
    .forEach(a => { if (out.includes(a)) return; out.push({...a, depth: d}); walk(key(a), d + 1); });
  walk(null, 0);
  for (const a of all) if (!out.find(o => o.addr === a.addr)) out.push({...a, depth: 1});
  return out;
}

/* ---------- operations panel ---------- */
const KIND = {UPDATE: "var(--review)", PASS: "var(--merged)", DONE: "var(--merged)", BLOCKED: "var(--error)", ERROR: "var(--error)",
  QUESTION: "var(--running)", ANSWER: "var(--master)", ORDER: "var(--started)", BRIEF: "var(--started)", INFO: "var(--muted)"};
const OPS = {tab: new URLSearchParams(location.search).get("ops") || localStorage.getItem("ops-tab") || "team", seen: +localStorage.getItem("ops-seen") || 0, who: "", open: localStorage.getItem("ops-open") !== "0"};
function ago(ts) {
  const d = (Date.now() - new Date(ts.replace(/([+-]\d\d)(\d\d)$/, "$1:$2"))) / 1000;
  return d < 60 ? Math.max(0, d | 0) + "s" : d < 3600 ? (d / 60 | 0) + "m" : (d / 3600 | 0) + "h " + ((d % 3600) / 60 | 0) + "m";
}
function hhmm(ts) { return (ts || "").slice(11, 16); }
function renderOps(st) {
  const o = st.ops || {}, comms = o.comms || [], r = o.resources || {}, caps = r.caps || {};
  const memBad = r.memFreePct != null && r.memFreePct < (caps.minMemFreePct || 15), diskBad = r.diskFreeGB < (caps.minDiskFreeGB || 8);
  $("res").className = "pill" + (memBad || diskBad ? " bad" : "");
  $("res").textContent = `mem ${r.memFreePct ?? "?"}% · disk ${r.diskFreeGB ?? "?"} GB · ${r.agents ?? 0}/${caps.maxAgents ?? "?"} agents`;
  $("ops").classList.toggle("closed", !OPS.open); $("opsToggle").classList.toggle("on", OPS.open);
  if (!OPS.open) return;
  const lastTs = comms.length ? Date.parse(comms[comms.length - 1].ts.replace(/([+-]\d\d)(\d\d)$/, "$1:$2")) : 0;
  if (OPS.tab === "msgs") { OPS.seen = lastTs; localStorage.setItem("ops-seen", lastTs); }
  const unread = comms.filter(m => Date.parse(m.ts.replace(/([+-]\d\d)(\d\d)$/, "$1:$2")) > OPS.seen).length;
  const su = o.suite || {};
  const tabs = [["team", "Team", treeOrder(st).length], ["lanes", "Lanes", (o.lanes || []).length], ["msgs", "Messages", unread, unread > 0],
    ["upd", "Updates", (o.progress || []).length], ["suite", "Suite", (su.holder ? 1 : 0) + (su.queue || []).length, !!su.holder]];
  $("opsNav").innerHTML = tabs.map(([k, l, n, hot]) => `<button data-t="${k}" class="${OPS.tab === k ? "on" : ""}">${l}<span class="n${hot ? " hot" : ""}">${n}</span></button>`).join("");
  $("opsNav").querySelectorAll("button").forEach(b => b.onclick = () => { OPS.tab = b.dataset.t; localStorage.setItem("ops-tab", OPS.tab); renderOps(S); });
  const body = $("opsBody"), keep = body.scrollTop, fn = {team: opsTeam, lanes: opsLanes, msgs: opsMsgs, upd: opsUpd, suite: opsSuite}[OPS.tab] || opsTeam;
  const html = fn(st, o);
  if (body._html !== html) { body.innerHTML = html; body._html = html; body.scrollTop = keep; }
  body.querySelectorAll("[data-agent]").forEach(c => c.onclick = () => select("ag:" + c.dataset.agent, true));
  body.querySelectorAll("[data-go]").forEach(c => c.onclick = () => select(c.dataset.go, true));
  body.querySelectorAll(".msg").forEach(m => m.onclick = () => m.classList.toggle("open"));
  const sel_ = body.querySelector("#whoF"); if (sel_) sel_.onchange = () => { OPS.who = sel_.value; body._html = ""; renderOps(S); };
}
function opsTeam(st, o) {
  const list = treeOrder(st);
  if (!list.length) return '<div class="empty">No agents running.</div>';
  const last = {};
  for (const m of o.comms || []) { last[m.from] = m; }
  const node = a => { const k = a.role === "stylus" ? "stylus" : a.name, m = last[k];
    const st_ = /blocked/i.test(m?.kind || "") ? "blocked" : a.status || (a.role === "stylus" ? "reasoning" : "idle");
    return `<div class="tn" data-agent="${esc(a.addr)}" style="margin-left:${a.depth * 18}px">
      <span class="lg">${LOGO(a)}</span>
      <div class="who"><b>${esc(a.role === "stylus" ? "Stylus" : a.name)}</b><small>${ROLEWORD[a.role] || a.role} · ${esc(CLINAME[a.cli] || a.cli || "")}${a.task ? " · " + esc(a.task) : ""}</small>
      <div>${m ? `${esc(m.kind)} ${ago(m.ts)} ago: ${esc(m.text.slice(0, 90))}` : esc(JOB[a.role] || "")}</div></div>
      <span class="sdot ${st_}" title="${esc(st_)}"></span></div>`; };
  return list.map(node).join("");
}
function opsLanes(st, o) {
  const lanes = o.lanes || [];
  if (!lanes.length) return '<div class="empty">No lanes in lanes.json.</div>';
  const agent = n => [...st.master, ...st.workers].find(a => a.name === n);
  return lanes.map(l => `<div class="lane"><h4><span class="id">${esc(l.id)}</span>${esc(l.name)}
      <span style="margin-left:auto;font-size:11px;color:var(--muted);font-weight:400">${l.tasks.filter(t => t.state === "merged").length}/${l.tasks.length}</span></h4>
    <p>${esc(l.about || "")}</p>
    <div class="chain">${l.tasks.map((t, i) => `${i ? '<span class="ar">→</span>' : ""}<span class="tk${t.id === l.current ? " cur" : ""}" data-go="${esc(t.id)}"
      style="--c:${(STATES[t.state] || STATES.todo).color}" title="${esc(t.title)} · ${esc((STATES[t.state] || STATES.todo).label)}${o.blocked?.[t.id] ? " · waits on " + esc(o.blocked[t.id]) : ""}">${esc(t.id === "FU" ? "Follow-ups" : t.id)}${o.blocked?.[t.id] ? " ⏸" : ""}</span>`).join("")}</div>
    <div class="ags">${l.agents.length ? l.agents.map(n => agent(n)).filter(Boolean).map(a => `<span class="chip" data-agent="${esc(a.addr)}"><span class="mini">${LOGO(a)}</span> ${esc(a.name)} · ${esc(a.status)}</span>`).join("") : '<span style="color:var(--faint);font-size:11px">no agent on this lane</span>'}</div></div>`).join("");
}
function opsMsgs(st, o) {
  const comms = o.comms || [], people = [...new Set(comms.flatMap(m => [m.from, m.to]))].sort();
  const rows = comms.filter(m => !OPS.who || m.from === OPS.who || m.to === OPS.who).slice().reverse();
  return `<div class="filt"><select id="whoF"><option value="">Everyone</option>${people.map(p => `<option ${p === OPS.who ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></div>` +
    (rows.length ? rows.map(m => `<div class="msg${m.delivered === false ? " undelivered" : ""}" style="--k:${KIND[m.kind] || "var(--muted)"}">
      <div class="mh"><b>${esc(m.from)}</b>→<b>${esc(m.to)}</b><span>${hhmm(m.ts)} · ${ago(m.ts)} ago</span><span class="kd">${esc(m.kind)}${m.delivered === false ? " · not delivered" : ""}</span></div>
      <div class="mt">${esc(m.text.replace(/^[A-Z_]+:\s*/, ""))}</div></div>`).join("") : '<div class="empty">No messages yet. Agents talk through .agents/bin/say.</div>');
}
function opsUpd(st, o) {
  const p = (o.progress || []).slice().reverse();
  return p.length ? p.map(u => `<div class="upd"><div class="mh"><b>${esc(u.by)}</b><span>${hhmm(u.ts)} · ${ago(u.ts)} ago</span><span>main ${esc(u.main || "")}</span>
      <span style="margin-left:auto">${(u.agents || []).length} agents · mem ${u.memFreePct}%</span></div><div class="mt">${esc(u.text)}</div></div>`).join("")
    : '<div class="empty">No progress updates yet. The ticker asks master every 10 minutes.</div>';
}
function opsSuite(st, o) {
  const su = o.suite || {}, r = o.resources || {}, c = r.caps || {};
  const h = su.holder;
  return `<div class="res"><div><b>${r.memFreePct ?? "?"}%</b><small>memory free (min ${c.minMemFreePct ?? "?"}%)</small></div>
      <div><b>${r.diskFreeGB ?? "?"} GB</b><small>disk free (min ${c.minDiskFreeGB ?? "?"})</small></div>
      <div><b>${r.agents ?? 0}/${c.maxAgents ?? "?"}</b><small>agents (workers ≤ ${c.maxWorkers ?? "?"})</small></div></div>
    <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Running now</h3>
    ${h ? `<div class="sr"><span class="sdot working"></span><b>${esc(h.who)}</b> ${esc(h.label || h.cmd)}<span class="t">${ago(h.since)}</span></div>` : '<div class="sr" style="color:var(--faint)">Nothing holds the suite lock.</div>'}
    <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Waiting</h3>
    ${(su.queue || []).length ? su.queue.map(q => `<div class="sr"><span class="sdot"></span><b>${esc(q.who)}</b> ${esc(q.label || q.cmd)}<span class="t">${ago(q.ts)}</span></div>`).join("") : '<div class="sr" style="color:var(--faint)">Nobody waiting.</div>'}
    <h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Recent runs</h3>
    ${(su.recent || []).slice().reverse().map(x => `<div class="sr"><span class="${x.exit ? "bad" : "ok"}">${x.exit ? "✕ exit " + x.exit : "✓ green"}</span><b>${esc(x.who)}</b> ${esc(x.label || x.cmd)}<span class="t">${Math.round(x.secs / 60)}m · ${hhmm(x.ts)}</span></div>`).join("") || '<div class="sr" style="color:var(--faint)">No runs yet.</div>'}`;
}
$("opsToggle").onclick = () => { OPS.open = !OPS.open; localStorage.setItem("ops-open", OPS.open ? "1" : "0"); renderOps(S); };

async function tick() {
  try {
    const st = await (await fetch("/state", {cache: "no-store"})).json();
    if (st.fatal) throw new Error(st.fatal);
    $("fatal").style.display = "none";
    draw(st);
    renderOps(st);
  } catch (e) {
    $("fatal").style.display = "block"; $("fatal").textContent = "Dashboard cannot read state: " + e.message;
    $("clock").textContent = "offline";
  }
  setTimeout(tick, 2000);
}
tick();
</script>
